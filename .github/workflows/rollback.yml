name: Roll back an update

# Promotes an earlier bundle back onto a channel, for a bad update that doesn't crash. Phones on
# that channel with the same runtime version move to it at their next check. See "Over-the-air
# updates" in docs/spec.md.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: The channel to roll back
        required: true
        type: choice
        options: [ti, main]
      version:
        description: The version to go back to, such as 0.46.1-ti
        required: true
        type: string

permissions: {}

# Two runs on a channel would each read its history and lose the other's line.
concurrency:
  group: rollback-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll ${{ inputs.channel }} back to ${{ inputs.version }}
    # The channel's Environment holds the release secrets; main's waits for the owner.
    environment: ${{ inputs.channel }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: apps/updates
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Promote the update
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPDATES_SIGNING_KEY: ${{ secrets.UPDATES_SIGNING_KEY }}
          WAVE_UPDATE_CHANNEL: ${{ inputs.channel }}
          WAVE_UPDATE_VERSION: ${{ inputs.version }}
        run: node apps/updates/scripts/promote.ts
