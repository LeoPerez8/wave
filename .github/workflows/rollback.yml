name: Roll back an update

# Promotes an earlier update back onto a channel, for a bad update that doesn't crash: the phone's
# bundle, or the desktop's installers. Each app's rollback touches only its own channel files in
# R2, never the other app's. Phones on that channel with the same runtime version move to it at
# their next check; desktops install it as an allowed downgrade. See "Rolling back an update" in
# docs/spec.md and docs/spec-desktop.md. It republishes what R2 keeps for that release, with no
# new build, once the release's record holds and R2's files are the ones it admitted
# (docs/release-provenance.md).
on:
  workflow_dispatch:
    inputs:
      app:
        description: The app to roll back
        required: true
        type: choice
        options: [mobile, desktop]
      channel:
        description: The channel to roll back
        required: true
        type: choice
        options: [ti, main]
      version:
        description: The version to go back to, such as 0.46.1-ti
        required: true
        type: string
      allow_unrecorded:
        description: Owner's transition, phone only. Allow a release published before provenance records, checked on its runtime version alone
        required: false
        type: boolean
        default: false

permissions: {}

# Two runs on a channel would each read its history and lose the other's line. The desktop's
# share a group with its release job, the phone's have their own.
concurrency:
  group: ${{ inputs.app == 'desktop' && format('desktop-release-{0}', inputs.channel) || format('rollback-{0}', inputs.channel) }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll the ${{ inputs.app }} on ${{ inputs.channel }} back to ${{ inputs.version }}
    # The channel's Environment holds the release secrets; main's waits for the owner.
    environment: ${{ inputs.channel }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            apps/updates
            scripts/ci
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # Before any secret, the release's GitHub Release has to carry the app's record for its tag's
      # commit: the phone's sealed record and its APK, or the desktop's record and the installers it
      # admitted, which needs no APK (a version the desktop released alone has none). Only the
      # owner's transition lets a phone release from before records through.
      - name: Check the release's provenance
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          APP: ${{ inputs.app }}
          ALLOW_UNRECORDED: ${{ inputs.allow_unrecorded }}
        run: |
          version="$(echo "$VERSION" | tr -d '[:space:]')"
          version="${version#v}"
          flags=()
          if [ "$APP" = mobile ] && [ "$ALLOW_UNRECORDED" = "true" ]; then flags=(--allow-unrecorded); fi
          case "$APP" in
            mobile) scripts/ci/verified-release.sh "v$version" "$RUNNER_TEMP/release" ${flags[@]+"${flags[@]}"} ;;
            desktop) scripts/ci/verified-desktop-release.sh "v$version" "$RUNNER_TEMP/release" ;;
            *)
              echo "::error::The app to roll back is mobile or desktop, not \"$APP\"."
              exit 1
              ;;
          esac

      # The phone's update, history and pointers only (updates/, assets/, apks/ in R2).
      - name: Promote the update
        if: inputs.app == 'mobile'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPDATES_SIGNING_KEY: ${{ secrets.UPDATES_SIGNING_KEY }}
          WAVE_UPDATE_CHANNEL: ${{ inputs.channel }}
          WAVE_UPDATE_VERSION: ${{ inputs.version }}
          WAVE_PROVENANCE_FILE: ${{ steps.provenance.outputs.file }}
          WAVE_ALLOW_UNRECORDED: ${{ inputs.allow_unrecorded }}
        run: node apps/updates/scripts/promote.ts

      # The desktop's channel pointer and history only (desktop/ in R2), with the downgrade allowed.
      - name: Roll back both desktop installers
        if: inputs.app == 'desktop'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WAVE_DESKTOP_UPDATE_SIGNING_KEY: ${{ secrets.WAVE_DESKTOP_UPDATE_SIGNING_KEY }}
          WAVE_UPDATE_CHANNEL: ${{ inputs.channel }}
          PROVENANCE: ${{ steps.provenance.outputs.file }}
        run: node apps/updates/scripts/desktop-release.ts rollback "$PROVENANCE" "$RUNNER_TEMP/release"
