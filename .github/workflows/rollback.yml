name: Roll back an update

# Promotes an earlier bundle back onto a channel, for a bad update that doesn't crash. Phones on
# that channel with the same runtime version move to it at their next check. See "Over-the-air
# updates" in docs/spec.md. It republishes the update R2 keeps for that release, with no new build,
# once the release's sealed provenance record holds and R2's update is the one it admitted
# (docs/release-provenance.md).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: The channel to roll back
        required: true
        type: choice
        options: [ti, main]
      version:
        description: The version to go back to, such as 0.46.1-ti
        required: true
        type: string
      target:
        description: The app to roll back
        required: true
        type: choice
        options: [android, desktop]
        default: android
      allow_unrecorded:
        description: Owner's transition. Allow a release published before provenance records, checked on its runtime version alone
        required: false
        type: boolean
        default: false

permissions: {}

# Two runs on a channel would each read its history and lose the other's line.
concurrency:
  group: ${{ inputs.target == 'desktop' && format('desktop-release-{0}', inputs.channel) || format('rollback-{0}', inputs.channel) }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll ${{ inputs.channel }} back to ${{ inputs.version }}
    # The channel's Environment holds the release secrets; main's waits for the owner.
    environment: ${{ inputs.channel }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            apps/updates
            scripts/ci
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # Before any secret: the release's GitHub Release has to carry a sealed record for its tag's
      # commit and its APK. Only the owner's transition lets a release from before records through.
      - name: Check the release's provenance
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          ALLOW_UNRECORDED: ${{ inputs.allow_unrecorded }}
        run: |
          version="$(echo "$VERSION" | tr -d '[:space:]')"
          version="${version#v}"
          flags=()
          if [ "$TARGET" = android ] && [ "$ALLOW_UNRECORDED" = "true" ]; then flags=(--allow-unrecorded); fi
          scripts/ci/verified-release.sh "v$version" "$RUNNER_TEMP/release" "${flags[@]}"

      - name: Verify the published desktop installers
        if: inputs.target == 'desktop'
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE: ${{ steps.provenance.outputs.file }}
        run: |
          tag="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).releaseTag' "$PROVENANCE")"
          assets="$(node apps/updates/scripts/desktop-release.ts names "$tag")"
          patterns=()
          while IFS= read -r asset; do patterns+=(--pattern "$asset"); done <<< "$assets"
          gh release download "$tag" --dir "$RUNNER_TEMP/release" "${patterns[@]}"
          node apps/updates/scripts/desktop-release.ts verify-published "$PROVENANCE" "$RUNNER_TEMP/release"

      - name: Promote the update
        if: inputs.target == 'android'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPDATES_SIGNING_KEY: ${{ secrets.UPDATES_SIGNING_KEY }}
          WAVE_UPDATE_CHANNEL: ${{ inputs.channel }}
          WAVE_UPDATE_VERSION: ${{ inputs.version }}
          WAVE_PROVENANCE_FILE: ${{ steps.provenance.outputs.file }}
          WAVE_ALLOW_UNRECORDED: ${{ inputs.allow_unrecorded }}
        run: node apps/updates/scripts/promote.ts

      - name: Roll back both desktop installers
        if: inputs.target == 'desktop'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WAVE_DESKTOP_UPDATE_SIGNING_KEY: ${{ secrets.WAVE_DESKTOP_UPDATE_SIGNING_KEY }}
          WAVE_UPDATE_CHANNEL: ${{ inputs.channel }}
          PROVENANCE: ${{ steps.provenance.outputs.file }}
        run: node apps/updates/scripts/desktop-release.ts rollback "$PROVENANCE" "$RUNNER_TEMP/release"
