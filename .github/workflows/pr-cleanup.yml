name: PR cleanup

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete-prerelease:
    name: Delete PR build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the PR's prerelease and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "pr-${{ github.event.pull_request.number }}" --cleanup-tag --yes || true
