name: Portuguese note

# Its own workflow because adding the line edits the PR's body, which shouldn't run all of CI.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pt-br-note-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  warn:
    name: Warn about a missing pt-BR line
    # A fork's token can't comment.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The base branch's scripts: this job can comment, so it runs none of the PR's code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # A missing line, or this step failing, never fails the job.
      - name: Warn or clear the warning
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci/pt-br-note.sh
