name: Fallow

on:
  pull_request:
  push:
    branches: [main]

# Each job asks for what it needs: the one that runs the PR's code gets a read-only token and
# leaves its PR comment to the Report job.
permissions: {}

concurrency:
  group: fallow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  IS_SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  fallow:
    name: Dead code and duplication
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: scripts/ci/step.sh "Install" pnpm install --frozen-lockfile

      - name: Full diagnostic report
        id: full
        # JSON diagnostics report the backlog without gating on its findings.
        # Configuration/runtime errors and the parse-error gate still fail.
        run: scripts/ci/step.sh "Fallow full diagnostic" pnpm --silent fallow --format json --output-file "$RUNNER_TEMP/fallow-full.json"

      - name: Check introduced findings
        shell: bash
        env:
          FALLOW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Pin the actual event base, even when the PR targets a release branch.
          git rev-parse --verify "${FALLOW_BASE}^{commit}"
          scripts/ci/step.sh "Fallow regressions" pnpm --silent fallow:check \
            --base "$FALLOW_BASE" --format github-summary | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload full diagnostic report
        if: always() && steps.full.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fallow-full-report
          path: ${{ runner.temp }}/fallow-full.json
          if-no-files-found: error

      - name: Report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci/report.sh "${{ job.status }}" "Fallow"

      - name: Keep the report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-fallow
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: ignore
          retention-days: 1

  # Posts the comment the job above left in its ci-report-* artifact. That job runs the PR's
  # code with a read-only token; this one runs none of it, using the base branch's scripts.
  report:
    name: Report
    needs: [fallow]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: ci-report-*
          merge-multiple: true
          path: ${{ runner.temp }}/ci-report

      - name: Post the comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A base from before the split has no poster.
          if [ ! -f scripts/ci/post-reports.sh ]; then
            echo "::warning::The base branch can't post this comment yet."
            exit 0
          fi
          scripts/ci/post-reports.sh "$RUNNER_TEMP/ci-report"
