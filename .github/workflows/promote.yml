name: Promote to main

# Publishes a -ti release to the main channel under the same number without the suffix, from the
# same commit (docs/spec.md, Releases). scripts/ci/promote.sh tags it and starts CI on the tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to promote, such as 0.51.0-ti. Empty takes the newest -ti release.
        required: false
        type: string

permissions: {}

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.version || 'the newest -ti release' }}
    runs-on: ubuntu-latest
    permissions:
      # Pushes the stable tag and starts CI on it.
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          # The -ti tags and the commits they're on; file contents on demand.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Tag the version and start its run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: scripts/ci/promote.sh "$VERSION"
