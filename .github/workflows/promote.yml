name: Promote to main

# Publishes a -ti release to the main channel under the same number without the suffix, each app
# from its own newest -ti release at or below it (docs/spec.md, Promotion). scripts/ci/promote.sh
# picks and checks those releases, tags the version and starts CI on the tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to promote, such as 0.51.0-ti. Empty takes the newest -ti release.
        required: false
        type: string
      app:
        description: The app to promote. both promotes each app that has something new, and the desktop only while RELEASE_DESKTOP_MAIN is on.
        required: false
        type: choice
        options: [both, mobile, desktop]
        default: both

permissions: {}

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.version || 'the newest -ti release' }} (${{ inputs.app || 'both' }})
    runs-on: ubuntu-latest
    permissions:
      # Pushes the stable tag and starts CI on it.
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The -ti tags and the commits they're on; file contents on demand.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Tag the version and start its run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          APP: ${{ inputs.app || 'both' }}
          RELEASE_DESKTOP_MAIN: ${{ vars.RELEASE_DESKTOP_MAIN }}
        run: scripts/ci/promote.sh "$VERSION" "$APP"
