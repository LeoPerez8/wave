name: CI

on:
  pull_request:
  push:
    # A push to main or ti that changes the app releases the next version (a -ti prerelease
    # on ti): the Version job commits and tags it on the branch, and the release job publishes
    # it (docs/spec.md, Releases). Pushing v<version> by hand publishes it too.
    branches: [main, ti]
    tags: ["v*"]

permissions:
  actions: read
  contents: write
  pull-requests: write

# Runs on main or ti queue up instead of cancelling each other: a run that has pushed its
# version bump must get to release it. A newer push still replaces a run that's only waiting,
# and the next run releases what that one would have, counting from the previous release.
# Across main and ti, the Version job takes turns too.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/ti' }}

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  IS_SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
  # A hand-pushed release tag's run. Stable releases build fully; ti prereleases may reuse
  # a compatible native APK. Branch pushes release through the Checks job's release_tag.
  IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
  IS_TI: ${{ github.ref == 'refs/heads/ti' || (startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-ti')) || github.event.pull_request.base.ref == 'ti' }}
  # A push to main or ti, which may release the next version (the Version job).
  IS_BUMP: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ti') }}

jobs:
  # What the change touches, by the rule in scripts/ci/changes.ts. Jobs that only
  # matter for some parts of the repo read these outputs to skip themselves.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.rule.outputs.app }}
      core: ${{ steps.rule.outputs.core }}
      workspace: ${{ steps.rule.outputs.workspace }}
      ci: ${{ steps.rule.outputs.ci }}
      native: ${{ steps.rule.outputs.native }}
      apk: ${{ steps.rule.outputs.apk }}
      nativeTests: ${{ steps.rule.outputs.nativeTests }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: scripts/ci

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Only node runs here; without this, setup-node looks for pnpm to cache.
          package-manager-cache: false

      - name: Apply the change rule
        id: rule
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/changes.sh

      - name: Report the skipped APK build
        if: steps.rule.outputs.apk == 'false' && env.IS_SAME_REPO_PR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/report-apk-skipped.sh

      - name: Report the skipped native unit tests
        if: steps.rule.outputs.nativeTests == 'false' && env.IS_SAME_REPO_PR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/ci/report.sh skipped "Native unit tests" \
            "Nothing they test changed (wave-native, wave-glass, the app config, config plugins, the lockfile or CI), so they didn't run."

  # A push to main or ti that changes the app releases the next version (ti's end in -ti):
  # this commits it to the branch's package.json as "Release Wave <version>", on top of the
  # branch's latest tip, and tags it v<version> in the same push (scripts/ci/bump-version.sh).
  # The rest of the run checks, builds and publishes that commit. CI, docs and spec-only pushes
  # don't release, and the log says why. Anywhere else the job does nothing.
  version:
    name: Version
    runs-on: ubuntu-latest
    # main and ti count from the same v* tags, so their bumps take turns: the next one reads
    # the tag this one pushed. The run-level group already lets only one run per branch in,
    # so this group never holds more than one waiting job, which GitHub would cancel.
    concurrency:
      group: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ti')) && 'version-bump' || format('version-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      # The version bump's commit, or the branch's tip when nothing is released; empty off
      # main and ti.
      sha: ${{ steps.bump.outputs.sha }}
      # v<version>, already on that commit, or empty.
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        if: env.IS_BUMP == 'true'
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v5
        if: env.IS_BUMP == 'true'
        with:
          node-version: 22
          package-manager-cache: false

      - name: Bump the version
        id: bump
        if: env.IS_BUMP == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/bump-version.sh "$GITHUB_REF_NAME"

  # The patch notes a release cut from this run's commit gets (scripts/ci/patch-notes.sh),
  # shown in the run's summary. A run that releases publishes them. They wait for the Version
  # job, whose bump may sit on a newer tip of main or ti than the pushed commit.
  notes:
    name: Patch notes
    needs: [version]
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
      # 'success' when they were built. A branch push only learns in Checks whether it
      # releases, so the release job checks this instead of this job failing.
      outcome: ${{ steps.notes.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha || github.event.pull_request.head.sha || github.sha }}
          # The previous version's tag and every commit since it; file contents on demand.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build the patch notes
        id: notes
        # Only a release needs them: anywhere else, failing here mustn't hold up the APK.
        continue-on-error: ${{ env.IS_RELEASE != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(scripts/ci/patch-notes.sh)"
          echo "$notes"
          { echo "notes<<WAVE_PATCH_NOTES"; echo "$notes"; echo "WAVE_PATCH_NOTES"; } >> "$GITHUB_OUTPUT"
          { echo "# Patch notes"; echo; echo "${notes:-Nothing to list: no PR since the last version changes the app.}"; } >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Checks
    needs: [version]
    runs-on: ubuntu-latest
    outputs:
      # The commit the rest of the run checks out: the autofix commit on PRs, the version
      # bump on main and ti.
      sha: ${{ steps.autofix.outputs.sha || needs.version.outputs.sha || github.event.pull_request.head.sha || github.sha }}
      # The versioned release this run publishes, or empty: the version bump's on main and ti
      # (scripts/ci/next-version.ts), or a hand-pushed tag, which "Check release tag" checked.
      release_tag: ${{ needs.version.outputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || needs.version.outputs.sha || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # setup-node v5 caches automatically when package.json has packageManager,
          # and fails without a lockfile, which only exists after the first autofix.
          package-manager-cache: ${{ hashFiles('pnpm-lock.yaml') != '' }}

      - name: Autofix lockfile and formatting
        id: autofix
        if: env.IS_SAME_REPO_PR == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: scripts/ci/step.sh "Autofix lockfile and formatting" scripts/ci/autofix.sh

      - name: Install
        run: scripts/ci/step.sh "Install" pnpm install --frozen-lockfile

      # Fails a tag that isn't v<app version> before the APK job starts.
      - name: Check release tag
        if: env.IS_RELEASE == 'true'
        run: scripts/ci/step.sh "Check release tag" scripts/ci/check-release-tag.sh "$GITHUB_REF_NAME"

      # On PRs, by the rule in scripts/ci/changes.ts: the packages the PR changed and their
      # dependents, or all of them. Pushes to main and release tags always check every package.
      - name: Pick the packages to check
        id: packages
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: scripts/ci/affected-packages.sh

      - name: Typecheck
        env:
          PACKAGES_FILTER: ${{ steps.packages.outputs.filter }}
        run: scripts/ci/step.sh "Typecheck" scripts/ci/packages.sh typecheck

      - name: Lint
        run: scripts/ci/step.sh "Lint" pnpm lint

      - name: Format check
        run: scripts/ci/step.sh "Format check" pnpm fmt:check

      - name: Test
        env:
          PACKAGES_FILTER: ${{ steps.packages.outputs.filter }}
        run: scripts/ci/step.sh "Test" scripts/ci/packages.sh test

      - name: Report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.autofix.outputs.sha || github.event.pull_request.head.sha }}
        run: scripts/ci/report.sh "${{ job.status }}" "Checks"

  # JVM tests for the local native modules (tag reading, folder walking, artwork, the
  # screen under Now Playing), in a job of their own so they run beside the APK build
  # instead of before it.
  native-tests:
    name: Native unit tests
    needs: [changes, checks]
    # Only PRs can skip: on main and release tags every area counts as changed.
    if: needs.changes.outputs.nativeTests == 'true'
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ needs.checks.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.checks.outputs.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Install
        run: scripts/ci/step.sh "Install" pnpm install --frozen-lockfile

      # The module builds inside the generated Android project.
      - name: Prebuild native project
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: ../../scripts/ci/step.sh "Prebuild" pnpm exec expo prebuild --platform android --no-install

      # AGP 9 only creates unit-test tasks for the tested build type (debug) in libraries.
      - name: Native unit tests
        working-directory: apps/mobile/android
        run: ../../../scripts/ci/step.sh "Native unit tests" ./gradlew :wave-native:testDebugUnitTest :wave-glass:testDebugUnitTest --no-daemon --console=plain

      - name: Report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/report.sh "${{ job.status }}" "Native unit tests"

  android:
    name: Android APK
    needs: [changes, checks, notes]
    outputs:
      artifact: ${{ steps.apk.outputs.name }}
    # Only PRs can skip: on main and release tags every area counts as changed.
    # Only a release needs the patch notes, so elsewhere a failed notes job doesn't stop the
    # APK. A job-level `if` can't read `env`, so the release test is IS_RELEASE spelled out.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.apk == 'true' && needs.checks.result == 'success' &&
      (needs.notes.result == 'success' ||
      !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ needs.checks.outputs.sha }}
      # ccache (scripts/ci/ccache.sh) keeps its cache in ~/.cache/ccache.
      # Paths under the checkout are hashed relative to it, and the working directory
      # isn't hashed, so a different checkout path still hits.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      # The NDK is installed fresh on every run, so its compilers' mtimes change.
      CCACHE_COMPILERCHECK: content
      CCACHE_INODECACHE: "true"
      # Some libraries build with precompiled headers, which ccache only caches with these.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CCACHE_MAXSIZE: 1G
      # A full build's APK and debug keystore, kept for repacks (scripts/ci/repack.ts).
      KEPT_APK: ${{ github.workspace }}/.cache/kept-apk
      WAVE_CI_BUNDLE_MANIFEST: ${{ github.workspace }}/../wave-ci-bundle.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.checks.outputs.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: scripts/ci/step.sh "Install" pnpm install --frozen-lockfile

      - name: Prebuild native project
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: ../../scripts/ci/step.sh "Prebuild" pnpm exec expo prebuild --platform android --no-install

      # Main and ti save Metro's cache; PRs and tags only read it. The key starts
      # over when dependencies change. The path is uniwind's cache store (os.tmpdir()), which
      # replaces Expo's in metro.config.js.
      - name: Restore Metro's cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/metro-cache
          key: metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # The label the app log names this build by, next to its version: `PR #<n> @ <commit>`,
      # or the branch or tag and the commit (scripts/ci/build-label.ts). Metro inlines it into
      # the bundle, so a repack carries this run's label, not the kept APK's.
      - name: Label the build
        run: |
          label="$(node scripts/ci/build-label.ts)"
          echo "$label" | tee -a "$GITHUB_ENV"

      # Expo + Hermes run once in either mode, before the key: Metro's assets are part of it.
      # The Gradle init script verifies its handoff below.
      - name: Bundle JavaScript
        run: scripts/ci/step.sh "Bundle JavaScript" scripts/ci/bundle.sh

      # Each full build keeps its APK under a key for its native side and Metro's assets
      # (scripts/ci/repack.ts). A PR whose key finds one swaps its JS bundle into it instead
      # of running Gradle.
      - name: Key the native side
        id: key
        run: node scripts/ci/repack.ts key apps/mobile apps/mobile/android/app/build/generated/res/react/release | tee -a "$GITHUB_OUTPUT"

      - name: Restore the kept APK
        id: kept
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.KEPT_APK }}
          key: ${{ steps.key.outputs.key }}
          lookup-only: ${{ github.event_name != 'pull_request' && env.IS_TI != 'true' }}

      # A tag cannot read ti's branch-scoped cache. Restore an exact-key full build
      # from a successful push on ti, validated by kept-apk.ts before downloading it.
      - name: Find a kept ti APK artifact
        id: kept_artifact
        if: env.IS_TI == 'true' && steps.kept.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_KEY: ${{ steps.key.outputs.key }}
        run: node scripts/ci/kept-apk.ts "$NATIVE_KEY" | tee -a "$GITHUB_OUTPUT"

      - name: Restore the kept ti APK artifact
        id: kept_download
        if: steps.kept_artifact.outputs.runId != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.kept_artifact.outputs.runId }}
          name: kept-${{ steps.key.outputs.key }}
          path: ${{ env.KEPT_APK }}

      # Main and stable tags stay full builds. TI pushes and tags may repack.
      - name: Plan the APK build
        env:
          KEPT: ${{ steps.kept.outputs.cache-hit == 'true' || steps.kept_download.outcome == 'success' }}
        run: node scripts/ci/repack.ts plan | tee -a "$GITHUB_ENV"

      - name: Repack the kept APK
        if: env.APK_BUILD == 'repack'
        run: |
          scripts/ci/step.sh "Repack the kept APK" scripts/ci/repack.sh "$KEPT_APK" "$RUNNER_TEMP/repacked.apk"
          echo "REPACKED_APK=$RUNNER_TEMP/repacked.apk" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        if: env.APK_BUILD == 'full'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        if: env.APK_BUILD == 'full'
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/ti' }}

      # Main and ti save their compiled objects; PRs and tags only restore them. Prefer
      # the same lockfile's latest entry, then seed new dependencies from an older one.
      - name: Restore ccache
        id: ccache
        if: env.APK_BUILD == 'full'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-v2-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ccache-android-v2-${{ hashFiles('pnpm-lock.yaml') }}-
            ccache-android-v2-

      - name: Set up ccache
        if: env.APK_BUILD == 'full'
        run: scripts/ci/ccache.sh setup

      - name: Save Metro's cache
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ti'
        uses: actions/cache/save@v4
        with:
          path: /tmp/metro-cache
          key: metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Build release APK
        if: env.APK_BUILD == 'full'
        working-directory: apps/mobile/android
        run: ../../../scripts/ci/step.sh "Gradle assembleRelease" ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --init-script ../../../scripts/ci/prebuilt-bundle.gradle --no-daemon --console=plain --profile --stacktrace

      # The APK must ship an ART profile, and once apps/mobile/profiles/ has Wave's own, nearly
      # all of it (#317). A repack keeps the kept build's dex and profile, so only full builds check.
      - name: Check the APK's ART profile
        if: env.APK_BUILD == 'full'
        run: scripts/ci/step.sh "ART profile check" node scripts/perf/perf.ts profile check-apk apps/mobile/android/app/build/outputs/apk/release/app-release.apk --mapping apps/mobile/android/app/build/outputs/mapping/release/mapping.txt

      - name: CMake task times
        if: always() && env.APK_BUILD == 'full'
        run: scripts/ci/cmake-times.sh apps/mobile/android

      - name: ccache statistics
        if: always() && env.APK_BUILD == 'full'
        run: scripts/ci/ccache.sh stats

      - name: Save ccache
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ti') && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      # Full PR builds may keep their own native APK too. GitHub scopes these cache entries
      # to that PR, so another PR can only read builds saved on its base or the default branch.
      # Gradle and Metro cache writes above stay limited to main and ti.
      - name: Keep the full build for JS-only PRs
        if: env.APK_BUILD == 'full' && steps.kept.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$KEPT_APK"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$KEPT_APK/"
          cp apps/mobile/android/app/debug.keystore "$KEPT_APK/"

      - name: Save the kept APK
        if: env.APK_BUILD == 'full' && steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.KEPT_APK }}
          key: ${{ steps.key.outputs.key }}

      - name: Keep ti's full APK for version tags
        if: github.ref == 'refs/heads/ti' && env.APK_BUILD == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: kept-${{ steps.key.outputs.key }}
          path: ${{ env.KEPT_APK }}
          include-hidden-files: true
          retention-days: 30

      - name: Collect APK
        id: apk
        run: |
          name="wave-${HEAD_SHA:0:7}.apk"
          built="${REPACKED_APK:-apps/mobile/android/app/build/outputs/apk/release/app-release.apk}"
          bundle="apps/mobile/android/app/build/generated/assets/react/release/index.android.bundle"
          unzip -p "$built" assets/index.android.bundle | cmp - "$bundle"
          echo "Packaged this run's bundle: $(sha256sum "$bundle")"
          # Hermes keeps the inlined label as a plain string.
          grep -qaF -- "${EXPO_PUBLIC_WAVE_BUILD_LABEL:?}" "$bundle"
          echo "Labelled: $EXPO_PUBLIC_WAVE_BUILD_LABEL"
          cp "$built" "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      # A prerelease per PR (and a rolling one for main) gives a stable link
      # that installs straight from the phone's browser.
      - name: Publish APK to a prerelease
        id: publish
        if: env.IS_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PR_NUMBER" ]; then tag="pr-$PR_NUMBER"; asset="wave-pr-$PR_NUMBER.apk"; title="PR #$PR_NUMBER build";
          elif [ "$GITHUB_REF" = "refs/heads/ti" ]; then tag="ti-latest"; asset="wave-ti.apk"; title="Latest ti test build";
          else tag="latest"; asset="wave-latest.apk"; title="Latest main build"; fi
          cp "${{ steps.apk.outputs.path }}" "$RUNNER_TEMP/$asset"
          gh release view "$tag" > /dev/null 2>&1 || \
            gh release create "$tag" --prerelease --latest=false --target "$HEAD_SHA" --title "$title" \
              --notes "Sideloadable APK, rebuilt on every push. Not for distribution."
          gh release upload "$tag" "$RUNNER_TEMP/$asset" --clobber
          echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/${asset}" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A job that fails before "Plan the APK build" has no build mode to report.
          extra=""
          if [ -n "${APK_BUILD:-}" ]; then extra="APK build: **$APK_BUILD**. ${APK_BUILD_REASON:-}"; fi
          if [ -n "${{ steps.publish.outputs.url }}" ]; then
            extra="$extra"$'\n\n'"📱 **[Download APK](${{ steps.publish.outputs.url }})** (built from \`${HEAD_SHA:0:7}\`)"
          fi
          scripts/ci/report.sh "${{ job.status }}" "Android APK" "$extra"

  # Publishes the release the Checks job decided on: a hand-pushed tag, or a branch push's
  # version bump, whose v<version> tag the Version job pushed with it. A tag pushed with the
  # workflow's token doesn't start another run.
  release:
    name: Publish versioned release
    needs: [checks, android, native-tests, notes]
    # Test releases can repack without Gradle, but neither channel publishes before
    # the native tests pass. The stable path keeps its full APK build policy.
    if: needs.checks.outputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check the patch notes
        env:
          NOTES_OUTCOME: ${{ needs.notes.outputs.outcome }}
        run: |
          if [ "$NOTES_OUTCOME" != "success" ]; then
            echo "::error::The Patch notes job failed, so nothing is published. Re-run the failed jobs."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.checks.outputs.sha }}
          sparse-checkout: scripts/ci

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.android.outputs.artifact }}
          path: ${{ runner.temp }}/release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.checks.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.checks.outputs.sha }}
          PATCH_NOTES: ${{ needs.notes.outputs.notes }}
          APK_NAME: ${{ needs.android.outputs.artifact }}
        run: |
          if [ -n "$PATCH_NOTES" ]; then
            export RELEASE_NOTES_FILE="$RUNNER_TEMP/patch-notes.md"
            printf '%s\n' "$PATCH_NOTES" > "$RELEASE_NOTES_FILE"
          fi
          scripts/ci/publish-release.sh "$RUNNER_TEMP/release/$APK_NAME"
