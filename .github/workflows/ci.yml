name: CI

on:
  pull_request:
  push:
    # A push to main that changes the app releases the next -ti prerelease to the ti channel:
    # the Version job commits and tags it on main, and the release job publishes it
    # (docs/spec.md, Releases). Pushing v<version> by hand publishes it too.
    branches: [main]
    tags: ["v*"]
  # The promotion's way in (promote.yml): its token's tag push starts no run, so it starts this
  # one on the tag. Off a v* tag, this run releases nothing and has no update channel.
  workflow_dispatch:

# Each job asks for what it needs. Jobs that run the PR's code (its scripts, dependencies and
# tests) get read-only tokens and leave their PR comments to the Report job.
permissions: {}

# Runs on main queue up instead of cancelling each other: a run that has pushed its version
# bump must get to release it. A newer push still replaces a run that's only waiting, and the
# next run releases what that one would have, counting from the previous release.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  IS_SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
  # A release tag's run, a promotion's or a hand-pushed one's. Stable releases build fully; -ti
  # prereleases may reuse a compatible native APK. Pushes to main release through the Checks
  # job's release_tag.
  IS_RELEASE: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') }}
  # A run for the ti channel: a push to main or a -ti tag, which may repack.
  IS_TI: ${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-ti')) }}
  # A push to main, which may release the next version (the Version job).
  IS_BUMP: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  # What the change touches, by the rule in scripts/ci/changes.ts. Jobs that only
  # matter for some parts of the repo read these outputs to skip themselves.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.rule.outputs.app }}
      core: ${{ steps.rule.outputs.core }}
      workspace: ${{ steps.rule.outputs.workspace }}
      ci: ${{ steps.rule.outputs.ci }}
      native: ${{ steps.rule.outputs.native }}
      nativeTests: ${{ steps.rule.outputs.nativeTests }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # Only node runs here; without this, setup-node looks for pnpm to cache.
          package-manager-cache: false

      - name: Apply the change rule
        id: rule
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/changes.sh

      - name: Report the skipped native unit tests
        if: steps.rule.outputs.nativeTests == 'false' && env.IS_SAME_REPO_PR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/ci/report.sh skipped "Native unit tests" \
            "Nothing they test or compile changed (wave-native, wave-glass, the app config, config plugins, the lockfile or CI), so they didn't run."

      - name: Keep the report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report-changes
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: ignore
          retention-days: 1

  # Fails when the commits this run brings in carry a secret (scripts/ci/secret-scan.sh, with
  # .gitleaks.toml). It runs the PR's scripts, so its token is read-only: its comment goes in a
  # ci-report-* artifact for the Report job to post.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      # Reads the run's jobs for the report.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # For the report's step timings; the scan itself needs no Node.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: scripts/ci/step.sh "Scan for secrets" scripts/ci/secret-scan.sh

      - name: Report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/report.sh "${{ job.status }}" "Secret scan"

      - name: Keep the report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report-secret-scan
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: ignore
          retention-days: 1

  # A push to main that changes the app releases the next -ti version: this commits it to
  # package.json as "Release Wave <version>", on top of main's latest tip, and tags it v<version> in the same push (scripts/ci/bump-version.sh).
  # The rest of the run checks, builds and publishes that commit. CI, docs and spec-only pushes
  # don't release, and the log says why. Anywhere else the job does nothing.
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      # Pushes the version bump and its tag; reads the merged PRs it counts.
      contents: write
      pull-requests: read
    outputs:
      # The version bump's commit, or main's tip when nothing is released; empty off main.
      sha: ${{ steps.bump.outputs.sha }}
      # v<version>, already on that commit, or empty.
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.IS_BUMP == 'true'
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: env.IS_BUMP == 'true'
        with:
          node-version: 22
          package-manager-cache: false

      - name: Bump the version
        id: bump
        if: env.IS_BUMP == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/bump-version.sh "$GITHUB_REF_NAME"

  # The patch notes a release cut from this run's commit gets (scripts/ci/patch-notes.sh),
  # shown in the run's summary. A run that releases publishes them. They wait for the Version
  # job, whose bump may sit on a newer tip of main than the pushed commit.
  notes:
    name: Patch notes
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
      # The same notes in each language, as one line of JSON, for the update service.
      localized: ${{ steps.notes.outputs.localized }}
      # 'success' when they were built. A branch push only learns in Checks whether it
      # releases, so the release job checks this instead of this job failing.
      outcome: ${{ steps.notes.outcome }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.version.outputs.sha || github.event.pull_request.head.sha || github.sha }}
          # The previous version's tag and every commit since it; file contents on demand.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build the patch notes
        id: notes
        # Only a release needs them: anywhere else, failing here mustn't hold up the APK.
        continue-on-error: ${{ env.IS_RELEASE != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LOCALIZED_NOTES_FILE: ${{ runner.temp }}/localized-notes.json
        run: |
          notes="$(scripts/ci/patch-notes.sh)"
          echo "$notes"
          { echo "notes<<WAVE_PATCH_NOTES"; echo "$notes"; echo "WAVE_PATCH_NOTES"; } >> "$GITHUB_OUTPUT"
          if [ -s "$LOCALIZED_NOTES_FILE" ]; then echo "localized=$(cat "$LOCALIZED_NOTES_FILE")" >> "$GITHUB_OUTPUT"; fi
          { echo "# Patch notes"; echo; echo "${notes:-Nothing to list: no PR since the last version changes the app.}"; } >> "$GITHUB_STEP_SUMMARY"

  # The lockfile and format autofix, in two jobs. This one runs the PR's install and format
  # with a read-only token and hands the result over as a patch; Apply autofix commits it only
  # when it holds nothing but a lockfile update and formatting. Both jobs always run, doing
  # nothing off same-repo PRs, so the jobs after them never see a skipped one.
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      patch: ${{ steps.fix.outputs.patch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.IS_SAME_REPO_PR == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: env.IS_SAME_REPO_PR == 'true'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: env.IS_SAME_REPO_PR == 'true'
        with:
          node-version: 22
          cache: pnpm

      # A failure here doesn't stop the run: Checks then checks the PR as it is.
      - name: Update the lockfile and format
        id: fix
        if: env.IS_SAME_REPO_PR == 'true'
        continue-on-error: true
        run: scripts/ci/step.sh "Autofix lockfile and formatting" scripts/ci/autofix.sh "$RUNNER_TEMP/autofix/autofix.patch"

      - name: Keep the patch
        if: steps.fix.outputs.patch == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix/autofix.patch
          retention-days: 1

      # With no patch, a marker alone clears an earlier "not applied" comment.
      - name: Report
        if: env.IS_SAME_REPO_PR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ steps.fix.outcome }}" = failure ]; then
            scripts/ci/report.sh failure "Autofix"
          elif [ "${{ steps.fix.outputs.patch }}" != true ]; then
            mkdir -p "$RUNNER_TEMP/ci-report"
            echo "<!-- wave-ci:Autofix -->" > "$RUNNER_TEMP/ci-report/autofix.md"
          fi

      - name: Keep the report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report-autofix
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: ignore
          retention-days: 1

  # Commits the Autofix job's patch to the PR branch, without running any of the PR's code: its
  # scripts and formatter come from the base branch, and the PR's checkout is only read and
  # committed to (scripts/ci/apply-autofix.sh). A patch it refuses fails nothing here; Checks
  # then fails on the PR's lockfile or formatting.
  autofix-apply:
    name: Apply autofix
    needs: [autofix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    env:
      PATCHED: ${{ needs.autofix.outputs.patch == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.PATCHED == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.PATCHED == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: env.PATCHED == 'true'

      # No dependency cache: the PR's own jobs can write one.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: env.PATCHED == 'true'
        with:
          node-version: 22
          package-manager-cache: false

      # The base's formatter: the root's tools alone, with no install scripts.
      - name: Install the base's formatter
        if: env.PATCHED == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts --filter wave

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.PATCHED == 'true'
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix

      # A failure here, such as the branch having moved on, leaves Checks to check the PR as it is.
      - name: Apply the lockfile and formatting
        id: apply
        if: env.PATCHED == 'true'
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # A base from before the split has no apply script.
          if [ ! -f scripts/ci/apply-autofix.sh ]; then
            echo "::warning::The base branch can't apply the autofix yet."
            exit 0
          fi
          scripts/ci/apply-autofix.sh "$RUNNER_TEMP/autofix/autofix.patch" pr

      - name: Report a failed apply
        if: steps.apply.outcome == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-report"
          {
            echo "<!-- wave-ci:Autofix -->"
            echo "### ❌ Autofix failed"
            echo
            echo "The lockfile and formatting fix couldn't be committed. The Apply autofix job in the [run]($RUN_URL) says why."
          } > "$RUNNER_TEMP/ci-report/autofix.md"

      - name: Keep the report
        if: always() && env.PATCHED == 'true' && job.status != 'cancelled'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report-autofix-apply
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: ignore
          retention-days: 1

  checks:
    name: Checks
    needs: [version, autofix-apply]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      # The commit the rest of the run checks out: the autofix commit on PRs, the version
      # bump on main.
      sha: ${{ needs.autofix-apply.outputs.sha || needs.version.outputs.sha || github.event.pull_request.head.sha || github.sha }}
      # The versioned release this run publishes, or empty: the version bump's on main
      # (scripts/ci/next-version.ts), or a promoted or hand-pushed tag, which "Check release tag"
      # checked.
      release_tag: ${{ needs.version.outputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.autofix-apply.outputs.sha || needs.version.outputs.sha || github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # setup-node v5 caches automatically when package.json has packageManager,
          # and fails without a lockfile, which only exists after the first autofix.
          package-manager-cache: ${{ hashFiles('pnpm-lock.yaml') != '' }}

      - name: Install
        run: scripts/ci/step.sh "Install" pnpm install --frozen-lockfile

      # Fails a tag that isn't v<app version> before the APK job starts.
      - name: Check release tag
        if: env.IS_RELEASE == 'true'
        run: scripts/ci/step.sh "Check release tag" scripts/ci/check-release-tag.sh "$GITHUB_REF_NAME"

      # On PRs, by the rule in scripts/ci/changes.ts: the packages the PR changed and their
      # dependents, or all of them. Pushes to main and release tags always check every package.
      - name: Pick the packages to check
        id: packages
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: scripts/ci/affected-packages.sh

      - name: Typecheck
        env:
          PACKAGES_FILTER: ${{ steps.packages.outputs.filter }}
        run: scripts/ci/step.sh "Typecheck" scripts/ci/packages.sh typecheck

      - name: Lint
        run: scripts/ci/step.sh "Lint" pnpm lint

      - name: Format check
        run: scripts/ci/step.sh "Format check" pnpm fmt:check

      - name: Action pins
        run: scripts/ci/step.sh "Action pins" node scripts/ci/action-pins.ts

      - name: Test
        env:
          PACKAGES_FILTER: ${{ steps.packages.outputs.filter }}
        run: scripts/ci/step.sh "Test" scripts/ci/packages.sh test

      - name: Report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.autofix-apply.outputs.sha || github.event.pull_request.head.sha }}
        run: scripts/ci/report.sh "${{ job.status }}" "Checks"

      - name: Keep the report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report-checks
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: ignore
          retention-days: 1

  # JVM tests for the local native modules (tag reading, folder walking, artwork, the
  # screen under Now Playing), in a job of their own so they run beside the APK build
  # instead of before it.
  native-tests:
    name: Native unit tests
    needs: [changes, checks]
    # Only PRs can skip: on main and release tags every area counts as changed.
    if: needs.changes.outputs.nativeTests == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      HEAD_SHA: ${{ needs.checks.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.checks.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Install
        run: scripts/ci/step.sh "Install" pnpm install --frozen-lockfile

      # The module builds inside the generated Android project.
      - name: Prebuild native project
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: ../../scripts/ci/step.sh "Prebuild" pnpm exec expo prebuild --platform android --no-install

      # AGP 9 only creates unit-test tasks for the tested build type (debug) in libraries.
      - name: Native unit tests
        working-directory: apps/mobile/android
        run: ../../../scripts/ci/step.sh "Native unit tests" ./gradlew :wave-native:testDebugUnitTest :wave-glass:testDebugUnitTest --no-daemon --console=plain

      # PRs build no APK, so this is where their native code compiles: the app's Kotlin and Java
      # and every native module's. The debug variant needs no JS bundle and no signing key.
      - name: Compile the app's native code
        if: github.event_name == 'pull_request'
        working-directory: apps/mobile/android
        run: ../../../scripts/ci/step.sh "Compile the app's native code" ./gradlew :app:compileDebugJavaWithJavac --no-daemon --console=plain

      - name: Report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/report.sh "${{ job.status }}" "Native unit tests"

      - name: Keep the report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report-native-tests
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: ignore
          retention-days: 1

  android:
    name: Android APK
    needs: [changes, checks, notes]
    outputs:
      artifact: ${{ steps.apk.outputs.name }}
      update_channel: ${{ steps.updates.outputs.WAVE_UPDATE_CHANNEL }}
      runtime_version: ${{ steps.updates.outputs.WAVE_RUNTIME_VERSION }}
    # Only release runs (pushes to main and tags) build an APK: a PR run gets no secret and no
    # signing key, and its native code compiles in the Native unit tests job.
    # Only a release needs the patch notes, so elsewhere a failed notes job doesn't stop the
    # APK. A job-level `if` can't read `env`, so the release test is the tag half of IS_RELEASE.
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && needs.checks.result == 'success' &&
      (needs.notes.result == 'success' ||
      !startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      # Publishes the rolling prerelease; reads main's kept APKs from other runs.
      contents: write
      actions: read
    env:
      # Ticketmaster Discovery's client key (docs/spec.md, "Followed artists"). Metro inlines it into
      # the JS bundle, which "Bundle JavaScript" builds once for full builds and repacks alike;
      # without it the APK never asks for shows. Genius's token is the sync Worker's alone.
      EXPO_PUBLIC_TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      HEAD_SHA: ${{ needs.checks.outputs.sha }}
      # ccache (scripts/ci/ccache.sh) keeps its cache in ~/.cache/ccache.
      # Paths under the checkout are hashed relative to it, and the working directory
      # isn't hashed, so a different checkout path still hits.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      # The NDK is installed fresh on every run, so its compilers' mtimes change.
      CCACHE_COMPILERCHECK: content
      CCACHE_INODECACHE: "true"
      # Some libraries build with precompiled headers, which ccache only caches with these.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CCACHE_MAXSIZE: 1G
      # A full build's APK and debug keystore, kept for repacks (scripts/ci/repack.ts).
      KEPT_APK: ${{ github.workspace }}/.cache/kept-apk
      WAVE_CI_BUNDLE_MANIFEST: ${{ github.workspace }}/../wave-ci-bundle.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.checks.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: scripts/ci/step.sh "Install" pnpm install --frozen-lockfile

      # A promotion's commit says x.y.z-ti in package.json, and its APK and bundle are x.y.z.
      # Before prebuild and the bundle, which read it. Nothing commits this.
      - name: Take the promoted version
        if: env.IS_RELEASE == 'true' && env.IS_TI != 'true'
        run: |
          sed -i -E 's/^(\s*"version":\s*)"[^"]*"/\1"'"${GITHUB_REF_NAME#v}"'"/' apps/mobile/package.json
          grep -F "\"version\": \"${GITHUB_REF_NAME#v}\"" apps/mobile/package.json

      - name: Prebuild native project
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: ../../scripts/ci/step.sh "Prebuild" pnpm exec expo prebuild --platform android --no-install

      # Main saves Metro's cache; tags only read it. The key starts
      # over when dependencies change. The path is uniwind's cache store (os.tmpdir()), which
      # replaces Expo's in metro.config.js.
      - name: Restore Metro's cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/metro-cache
          key: metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # The label the app log names this build by, next to its version: `PR #<n> @ <commit>`,
      # or the branch or tag and the commit (scripts/ci/build-label.ts). Metro inlines it into
      # the bundle, so a repack carries this run's label, not the kept APK's.
      - name: Label the build
        run: |
          label="$(node scripts/ci/build-label.ts)"
          echo "$label" | tee -a "$GITHUB_ENV"

      # Expo + Hermes run once in either mode, before the key: Metro's assets are part of it.
      # The Gradle init script verifies its handoff below.
      - name: Bundle JavaScript
        run: scripts/ci/step.sh "Bundle JavaScript" scripts/ci/bundle.sh

      # Each full build keeps its APK under a key for its native side and Metro's assets
      # (scripts/ci/repack.ts). A push to main or a -ti tag whose key finds one swaps its JS
      # bundle into it instead of running Gradle.
      - name: Key the native side
        id: key
        run: node scripts/ci/repack.ts key apps/mobile apps/mobile/android/app/build/generated/res/react/release | tee -a "$GITHUB_OUTPUT"

      # The key is the runtime version: one rule for "same native side". The channel follows
      # the run (scripts/ci/update-config.ts).
      - name: Pick the update channel
        id: updates
        env:
          RUNTIME_VERSION: ${{ steps.key.outputs.key }}
        run: |
          { node scripts/ci/update-config.ts channel; echo "WAVE_RUNTIME_VERSION=$RUNTIME_VERSION"; } | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"

      # After the key, which must not depend on the channel. A repack stamps inside repack.sh.
      - name: Stamp the update channel and runtime version
        run: node scripts/ci/update-config.ts stamp-source apps/mobile/android/app/src/main/AndroidManifest.xml

      # What the release job publishes over the air. Never holds up the release. It needs no
      # secret: only the release job, in its channel's Environment, can publish it.
      - name: Export the over-the-air update
        id: export_update
        if: needs.checks.outputs.release_tag != '' && env.WAVE_UPDATE_CHANNEL != ''
        continue-on-error: true
        run: scripts/ci/step.sh "Export the over-the-air update" scripts/ci/export-update.sh "$RUNNER_TEMP/update"

      - name: Keep the over-the-air update
        if: steps.export_update.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-${{ needs.checks.outputs.release_tag }}
          path: ${{ runner.temp }}/update
          retention-days: 1

      - name: Restore the kept APK
        id: kept
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.KEPT_APK }}
          key: ${{ steps.key.outputs.key }}
          lookup-only: ${{ env.IS_TI != 'true' }}

      # When the cache has no entry, restore an exact-key full build from a successful
      # push on main, validated by kept-apk.ts before downloading it.
      - name: Find a kept APK artifact
        id: kept_artifact
        if: env.IS_TI == 'true' && steps.kept.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_KEY: ${{ steps.key.outputs.key }}
        run: node scripts/ci/kept-apk.ts "$NATIVE_KEY" | tee -a "$GITHUB_OUTPUT"

      - name: Restore the kept APK artifact
        id: kept_download
        if: steps.kept_artifact.outputs.runId != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.kept_artifact.outputs.runId }}
          name: kept-${{ steps.key.outputs.key }}
          path: ${{ env.KEPT_APK }}

      # Stable tags stay full builds. Pushes to main and -ti tags may repack.
      - name: Plan the APK build
        env:
          KEPT: ${{ steps.kept.outputs.cache-hit == 'true' || steps.kept_download.outcome == 'success' }}
        run: node scripts/ci/repack.ts plan | tee -a "$GITHUB_ENV"

      - name: Repack the kept APK
        if: env.APK_BUILD == 'repack'
        run: |
          scripts/ci/step.sh "Repack the kept APK" scripts/ci/repack.sh "$KEPT_APK" "$RUNNER_TEMP/repacked.apk"
          echo "REPACKED_APK=$RUNNER_TEMP/repacked.apk" >> "$GITHUB_ENV"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: env.APK_BUILD == 'full'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        if: env.APK_BUILD == 'full'
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Main saves its compiled objects; tags only restore them. Prefer
      # the same lockfile's latest entry, then seed new dependencies from an older one.
      - name: Restore ccache
        id: ccache
        if: env.APK_BUILD == 'full'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-android-v2-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ccache-android-v2-${{ hashFiles('pnpm-lock.yaml') }}-
            ccache-android-v2-

      - name: Set up ccache
        if: env.APK_BUILD == 'full'
        run: scripts/ci/ccache.sh setup

      - name: Save Metro's cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/metro-cache
          key: metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Build release APK
        if: env.APK_BUILD == 'full'
        working-directory: apps/mobile/android
        run: ../../../scripts/ci/step.sh "Gradle assembleRelease" ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --init-script ../../../scripts/ci/prebuilt-bundle.gradle --no-daemon --console=plain --profile --stacktrace

      # Room creates WorkManager's database reflectively before JS starts. Check the
      # minified artifact on full builds and repacks; a debug/unit test misses this.
      - name: Check WorkManager's startup constructor
        run: |
          built="${REPACKED_APK:-apps/mobile/android/app/build/outputs/apk/release/app-release.apk}"
          dexdump="$(find "$ANDROID_HOME/build-tools" -name dexdump -type f | sort -V | tail -n 1)"
          test -n "$dexdump"
          "$dexdump" -l xml "$built" | node scripts/ci/work-database.ts

      # The APK must ship an ART profile, and once apps/mobile/profiles/ has Wave's own, nearly
      # all of it (#317). A repack keeps the kept build's dex and profile, so only full builds check.
      - name: Check the APK's ART profile
        if: env.APK_BUILD == 'full'
        run: scripts/ci/step.sh "ART profile check" node scripts/perf/perf.ts profile check-apk apps/mobile/android/app/build/outputs/apk/release/app-release.apk --mapping apps/mobile/android/app/build/outputs/mapping/release/mapping.txt

      - name: CMake task times
        if: always() && env.APK_BUILD == 'full'
        run: scripts/ci/cmake-times.sh apps/mobile/android

      - name: ccache statistics
        if: always() && env.APK_BUILD == 'full'
        run: scripts/ci/ccache.sh stats

      - name: Save ccache
        if: github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      # A full build keeps its APK for later runs with the same native side to repack.
      # Gradle and Metro cache writes above stay limited to main.
      - name: Keep the full build for repacks
        if: env.APK_BUILD == 'full' && steps.kept.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$KEPT_APK"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$KEPT_APK/"
          cp apps/mobile/android/app/debug.keystore "$KEPT_APK/"

      - name: Save the kept APK
        if: env.APK_BUILD == 'full' && steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.KEPT_APK }}
          key: ${{ steps.key.outputs.key }}

      - name: Keep main's full APK for when the cache misses
        if: github.ref == 'refs/heads/main' && env.APK_BUILD == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kept-${{ steps.key.outputs.key }}
          path: ${{ env.KEPT_APK }}
          include-hidden-files: true
          retention-days: 30

      - name: Collect APK
        id: apk
        run: |
          name="wave-${HEAD_SHA:0:7}.apk"
          built="${REPACKED_APK:-apps/mobile/android/app/build/outputs/apk/release/app-release.apk}"
          bundle="apps/mobile/android/app/build/generated/assets/react/release/index.android.bundle"
          unzip -p "$built" assets/index.android.bundle | cmp - "$bundle"
          echo "Packaged this run's bundle: $(sha256sum "$bundle")"
          # Hermes keeps the inlined label as a plain string.
          grep -qaF -- "${EXPO_PUBLIC_WAVE_BUILD_LABEL:?}" "$bundle"
          echo "Labelled: $EXPO_PUBLIC_WAVE_BUILD_LABEL"
          if [ -n "${EXPO_PUBLIC_TICKETMASTER_API_KEY:-}" ]; then
            grep -qaF -- "$EXPO_PUBLIC_TICKETMASTER_API_KEY" "$bundle"
            echo "Carries Ticketmaster's key"
          else
            echo "::warning::No TICKETMASTER_API_KEY secret: this APK never asks for shows."
          fi
          cp "$built" "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The APK's and the Hermes bundle's size against their budget (scripts/ci/size-budget.json),
      # for the sticky comment and every run's summary, releases' included. Over budget warns;
      # it never fails the build.
      - name: Measure the APK and the bundle
        continue-on-error: true
        run: |
          node scripts/ci/app-size.ts "${{ steps.apk.outputs.path }}" \
            apps/mobile/android/app/build/generated/assets/react/release/index.android.bundle \
            "$RUNNER_TEMP/app-size.md"
          cat "$RUNNER_TEMP/app-size.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      # A rolling prerelease per channel gives a stable link that installs straight from the
      # phone's browser: ti-latest moves on every push to main. The release job moves latest,
      # once a promotion has passed its native tests.
      - name: Publish APK to a prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ti-latest"; asset="wave-ti.apk"
          cp "${{ steps.apk.outputs.path }}" "$RUNNER_TEMP/$asset"
          gh release view "$tag" > /dev/null 2>&1 || \
            gh release create "$tag" --prerelease --latest=false --target "$HEAD_SHA" --title "Latest ti test build" \
              --notes "Sideloadable APK, rebuilt on every push. Not for distribution."
          gh release upload "$tag" "$RUNNER_TEMP/$asset" --clobber

      - name: Keep the report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report-android
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: ignore
          retention-days: 1

  # Posts the comments the jobs above left in their ci-report-* artifacts. Those jobs run the
  # PR's code with read-only tokens; this one runs none of it, using the base branch's scripts.
  report:
    name: Report
    needs: [changes, secret-scan, autofix, autofix-apply, checks, native-tests, android]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: ci-report-*
          merge-multiple: true
          path: ${{ runner.temp }}/ci-report

      - name: Post the comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A base from before the split has no poster.
          if [ ! -f scripts/ci/post-reports.sh ]; then
            echo "::warning::The base branch can't post these comments yet."
            exit 0
          fi
          scripts/ci/post-reports.sh "$RUNNER_TEMP/ci-report"

  # Publishes the release the Checks job decided on: a hand-pushed tag, or a branch push's
  # version bump, whose v<version> tag the Version job pushed with it. A tag pushed with the
  # workflow's token doesn't start another run.
  release:
    name: Publish versioned release
    needs: [checks, android, native-tests, notes]
    # Test releases can repack without Gradle, but neither channel publishes before
    # the native tests pass. The stable path keeps its full APK build policy.
    if: needs.checks.outputs.release_tag != ''
    # The release secrets live only in the release Environments (docs/spec.md, Release
    # secrets). ti opens to pushes to main with no approval; every tag run, a promotion's or a
    # hand-pushed -ti tag's, takes main and waits for the owner. The channel stays the run's.
    environment: ${{ github.ref == 'refs/heads/main' && 'ti' || 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPDATES_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.UPDATES_SIGNING_KEY != '' }}
    steps:
      - name: Check the patch notes
        env:
          NOTES_OUTCOME: ${{ needs.notes.outputs.outcome }}
        run: |
          if [ "$NOTES_OUTCOME" != "success" ]; then
            echo "::error::The Patch notes job failed, so nothing is published. Re-run the failed jobs."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.checks.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            apps/updates

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.android.outputs.artifact }}
          path: ${{ runner.temp }}/release

      - name: Publish the release
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.checks.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.checks.outputs.sha }}
          PATCH_NOTES: ${{ needs.notes.outputs.notes }}
          APK_NAME: ${{ needs.android.outputs.artifact }}
        run: |
          if [ -n "$PATCH_NOTES" ]; then
            export RELEASE_NOTES_FILE="$RUNNER_TEMP/patch-notes.md"
            printf '%s\n' "$PATCH_NOTES" > "$RELEASE_NOTES_FILE"
          fi
          scripts/ci/publish-release.sh "$RUNNER_TEMP/release/$APK_NAME"

      # The rolling link to what's on the main channel.
      - name: Move the latest build
        if: steps.published.outputs.url != '' && !endsWith(needs.checks.outputs.release_tag, '-ti')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ needs.android.outputs.artifact }}
        run: |
          cp "$RUNNER_TEMP/release/$APK_NAME" "$RUNNER_TEMP/wave-latest.apk"
          gh release upload latest "$RUNNER_TEMP/wave-latest.apk" --clobber

      # After the release, so phones never get a version that has none: publish-release.sh answers
      # no url when it published nothing (a moved tag). None of these can fail the release: without
      # the secrets the last one says so and publishes nothing.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.published.outputs.url != ''
        continue-on-error: true
        with:
          node-version: 22
          package-manager-cache: false

      # Before the update, so a phone that gets it finds its notes.
      - name: Publish the release notes
        if: steps.published.outputs.url != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WAVE_UPDATE_CHANNEL: ${{ needs.android.outputs.update_channel }}
          WAVE_RELEASE_TAG: ${{ needs.checks.outputs.release_tag }}
          WAVE_RELEASE_NOTES: ${{ needs.notes.outputs.localized }}
        run: node apps/updates/scripts/publish-notes.ts

      # The APK phones on another native side install (docs/spec.md, Build and CI).
      - name: Publish the latest APK
        if: steps.published.outputs.url != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPDATES_SIGNING_KEY: ${{ secrets.UPDATES_SIGNING_KEY }}
          WAVE_UPDATE_CHANNEL: ${{ needs.android.outputs.update_channel }}
          WAVE_RUNTIME_VERSION: ${{ needs.android.outputs.runtime_version }}
          WAVE_RELEASE_TAG: ${{ needs.checks.outputs.release_tag }}
          WAVE_APK_URL: ${{ steps.published.outputs.url }}
          APK_NAME: ${{ needs.android.outputs.artifact }}
        run: WAVE_APK_PATH="$RUNNER_TEMP/release/$APK_NAME" node apps/updates/scripts/publish-apk.ts

      - name: Fetch the over-the-air update
        if: env.UPDATES_CONFIGURED == 'true' && steps.published.outputs.url != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: update-${{ needs.checks.outputs.release_tag }}
          path: ${{ runner.temp }}/update

      - name: Publish the over-the-air update
        if: steps.published.outputs.url != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPDATES_SIGNING_KEY: ${{ secrets.UPDATES_SIGNING_KEY }}
          WAVE_UPDATE_CHANNEL: ${{ needs.android.outputs.update_channel }}
          WAVE_RUNTIME_VERSION: ${{ needs.android.outputs.runtime_version }}
        run: node apps/updates/scripts/publish.ts "$RUNNER_TEMP/update"
