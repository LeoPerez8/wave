name: CI

on:
  pull_request:
  push:
    # A push to main that changes the phone or the desktop releases the next -ti prerelease to
    # the ti channel: the Version job commits and tags it on main, and the release job of each app
    # that changed publishes it (mobile.yml, desktop.yml; docs/spec.md, Releases). Pushing
    # v<version> by hand publishes it too.
    branches: [main]
    tags: ["v*"]
  # The promotion's way in (promote.yml): its token's tag push starts no run, so it starts this
  # one on the tag. Off a v* tag, this run releases nothing and has no update channel.
  workflow_dispatch:
    inputs:
      # Set by promote.sh, once per ti release the promoted apps come from (docs/spec.md,
      # Promotion). Empty, the run picks its apps by the change rule, as a pushed tag does.
      app:
        description: The apps this promotion run publishes, both, mobile or desktop. Empty follows the change rule.
        required: false
        type: string
        default: ""
      promoted_from:
        description: The -ti release those apps are built from, at or below the tag. Empty takes the tag's own number.
        required: false
        type: string
        default: ""

# This file holds the jobs both apps share and calls each app's own workflow: mobile.yml for the
# phone and desktop.yml for the desktop, so one app's failure never holds up the other's release.
# Each job asks for what it needs. Jobs that run the PR's code (its scripts, dependencies and
# tests) get read-only tokens and leave their PR comments to the Report job.
permissions: {}

# Runs on main queue up instead of cancelling each other: a run that has pushed its version
# bump must get to release it. A newer push still replaces a run that's only waiting, and the
# next run releases what that one would have, counting from the previous release.
# A promotion may start one run per app on the same tag, so each app has its own group there.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ inputs.app && format('-{0}', inputs.app) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  IS_SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
  # A release tag's run, a promotion's or a hand-pushed one's. Pushes to main release through
  # the Checks job's release_tag.
  IS_RELEASE: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') }}
  # A run for the ti channel: a push to main or a -ti tag. The patch notes count from that
  # channel's previous version (patch-notes.sh, earlier-notes.sh).
  IS_TI: ${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-ti')) }}
  # A push to main, which may release the next version (the Version job).
  IS_BUMP: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  # What the change touches, by the rule in scripts/ci/changes.ts. Jobs that only
  # matter for some parts of the repo read these outputs to skip themselves. On main and tags,
  # phoneRelease and desktopRelease say whether each app changed since its own previous release,
  # which decides whether mobile.yml and desktop.yml run at all. They count what the release
  # source holds: on main, the Version job's bump may sit on a newer tip than the pushed commit.
  changes:
    name: Changes
    needs: [source]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.rule.outputs.app }}
      core: ${{ steps.rule.outputs.core }}
      workspace: ${{ steps.rule.outputs.workspace }}
      ci: ${{ steps.rule.outputs.ci }}
      native: ${{ steps.rule.outputs.native }}
      nativeTests: ${{ steps.rule.outputs.nativeTests }}
      desktopChecks: ${{ steps.rule.outputs.desktopChecks }}
      phoneRelease: ${{ steps.rule.outputs.phoneRelease }}
      desktopRelease: ${{ steps.rule.outputs.desktopRelease }}
      # The desktop's previous release on main and tags, which its patch notes count from.
      desktopSince: ${{ steps.rule.outputs.desktopSince }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          sparse-checkout: scripts/ci
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Only node runs here; without this, setup-node looks for pnpm to cache.
          package-manager-cache: false

      - name: Apply the change rule
        id: rule
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTED_APP: ${{ inputs.app }}
        run: scripts/ci/changes.sh

      - name: Report the skipped native unit tests
        if: steps.rule.outputs.nativeTests == 'false' && env.IS_SAME_REPO_PR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/ci/report.sh skipped "Native unit tests" \
            "Nothing they test or compile changed (wave-native, wave-glass, the shared Kotlin, the app config, config plugins, the lockfile or CI), so they didn't run."

      - name: Report the skipped desktop checks
        if: steps.rule.outputs.desktopChecks == 'false' && env.IS_SAME_REPO_PR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for job in "Desktop (Linux)" "Desktop (Windows)"; do
            scripts/ci/report.sh skipped "$job"               "Nothing the desktop app is built from changed (apps/desktop, packages/client, core, theme or kotlin-shared, the lockfile or CI), so they didn't run."
          done

      - name: Keep the report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-changes
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: ignore
          retention-days: 1

  # Fails when the release source carries a secret (scripts/ci/secret-scan.sh, with
  # .gitleaks.toml): a PR's commits up to its autofix commit, or every commit the source adds
  # since its channel's previous release, version bump included. Its outputs are evidence for
  # the release gate. It runs the PR's scripts, so its token is read-only: its comment goes in a
  # ci-report-* artifact for the Report job to post.
  secret-scan:
    name: Secret scan
    needs: [source]
    runs-on: ubuntu-latest
    permissions:
      # Reads the run's jobs for the report.
      actions: read
      contents: read
    outputs:
      source: ${{ steps.scan.outputs.source }}
      range: ${{ steps.scan.outputs.range }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          # The source's history and the release tags its range starts from.
          fetch-depth: 0
          persist-credentials: false

      # For the report's step timings; the scan itself needs no Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Scan for secrets
        id: scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: scripts/ci/step.sh "Scan for secrets" scripts/ci/secret-scan.sh

      - name: Report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/report.sh "${{ job.status }}" "Secret scan"

      - name: Keep the report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-secret-scan
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: ignore
          retention-days: 1

  # A push to main that changes the phone or the desktop releases the next -ti version: this
  # commits it to package.json as "Release Wave <version>", on top of main's latest tip, and tags
  # it v<version> in the same push (scripts/ci/bump-version.sh).
  # The rest of the run checks, builds and publishes that commit. CI, docs and spec-only pushes
  # don't release, and the log says why. Anywhere else the job does nothing.
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      # Pushes the version bump and its tag; reads the merged PRs it counts.
      contents: write
      pull-requests: read
    outputs:
      # The version bump's commit, or main's tip when nothing is released; empty off main.
      sha: ${{ steps.bump.outputs.sha }}
      # v<version>, already on that commit, or empty.
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.IS_BUMP == 'true'
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.IS_BUMP == 'true'
        with:
          node-version: 22
          package-manager-cache: false

      - name: Bump the version
        id: bump
        if: env.IS_BUMP == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/bump-version.sh "$GITHUB_REF_NAME"

  # The patch notes a release cut from this run's commit gets (scripts/ci/patch-notes.sh),
  # shown in the run's summary. A run that releases publishes them. They wait for the Version
  # job, whose bump may sit on a newer tip of main than the pushed commit. The phone's count from
  # the channel's previous tag, and the desktop's from its own previous release (Changes).
  notes:
    name: Patch notes
    needs: [version, source, changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
      # The same notes in each language, as one line of JSON, for the update service.
      localized: ${{ steps.notes.outputs.localized }}
      desktop_localized: ${{ steps.notes.outputs.desktop_localized }}
      # The desktop's notes in Markdown, for the GitHub Release of a version it publishes.
      desktop: ${{ steps.notes.outputs.desktop }}
      # The notes of the versions before it that never published (scripts/ci/earlier-notes.sh),
      # which the release publishes too, each under its own version.
      earlier: ${{ steps.notes.outputs.earlier }}
      # 'success' when they were built. A branch push only learns in Checks whether it
      # releases, so the release gate checks this instead of this job failing.
      outcome: ${{ steps.notes.outcome }}
      source: ${{ steps.checked.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          # The previous version's tag and every commit since it; file contents on demand.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # The release gate's evidence: the commit this job actually checked out.
      - name: Record the checked-out source
        id: checked
        run: echo "source=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build the patch notes
        id: notes
        # Only a release needs them: anywhere else, failing here mustn't hold up the APK.
        continue-on-error: ${{ env.IS_RELEASE != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LOCALIZED_NOTES_FILE: ${{ runner.temp }}/localized-notes.json
          DESKTOP_NOTES_FILE: ${{ runner.temp }}/desktop-notes.json
          DESKTOP_RELEASE_NOTES_FILE: ${{ runner.temp }}/desktop-notes.md
          DESKTOP_NOTES_SINCE: ${{ needs.changes.outputs.desktopSince }}
        run: |
          notes="$(scripts/ci/patch-notes.sh)"
          echo "$notes"
          { echo "notes<<WAVE_PATCH_NOTES"; echo "$notes"; echo "WAVE_PATCH_NOTES"; } >> "$GITHUB_OUTPUT"
          if [ -s "$LOCALIZED_NOTES_FILE" ]; then echo "localized=$(cat "$LOCALIZED_NOTES_FILE")" >> "$GITHUB_OUTPUT"; fi
          if [ -s "$DESKTOP_NOTES_FILE" ]; then echo "desktop_localized=$(cat "$DESKTOP_NOTES_FILE")" >> "$GITHUB_OUTPUT"; fi
          desktop=""
          if [ -s "$DESKTOP_RELEASE_NOTES_FILE" ]; then desktop="$(cat "$DESKTOP_RELEASE_NOTES_FILE")"; fi
          { echo "desktop<<WAVE_PATCH_NOTES"; echo "$desktop"; echo "WAVE_PATCH_NOTES"; } >> "$GITHUB_OUTPUT"
          { echo "# Patch notes"; echo; echo "${notes:-Nothing to list: no PR since the last version changes the app.}"; } >> "$GITHUB_STEP_SUMMARY"
          { echo; echo "# Desktop patch notes"; echo; echo "${desktop:-Nothing to list: no PR since the desktop's last version changes it.}"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$IS_BUMP" = "true" ] || [ "$IS_RELEASE" = "true" ]; then
            if earlier="$(scripts/ci/earlier-notes.sh)"; then
              echo "earlier=$earlier" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Couldn't build the notes of the versions that never published; the release goes without them."
            fi
          fi

  # The lockfile and format autofix, in two jobs. This one runs the PR's install and format
  # with a read-only token and hands the result over as a patch; Apply autofix commits it only
  # when it holds nothing but a lockfile update and formatting. Both jobs always run, doing
  # nothing off same-repo PRs, so the jobs after them never see a skipped one.
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      patch: ${{ steps.fix.outputs.patch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.IS_SAME_REPO_PR == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: env.IS_SAME_REPO_PR == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.IS_SAME_REPO_PR == 'true'
        with:
          node-version: 22
          package-manager-cache: false

      - uses: ./.github/actions/pnpm-store
        if: env.IS_SAME_REPO_PR == 'true'

      # A failure here doesn't stop the run: Checks then checks the PR as it is.
      - name: Update the lockfile and format
        id: fix
        if: env.IS_SAME_REPO_PR == 'true'
        continue-on-error: true
        run: scripts/ci/step.sh "Autofix lockfile and formatting" scripts/ci/autofix.sh "$RUNNER_TEMP/autofix/autofix.patch"

      - name: Keep the patch
        if: steps.fix.outputs.patch == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix/autofix.patch
          retention-days: 1

      # With no patch, a marker alone clears an earlier "not applied" comment.
      - name: Report
        if: env.IS_SAME_REPO_PR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ steps.fix.outcome }}" = failure ]; then
            scripts/ci/report.sh failure "Autofix"
          elif [ "${{ steps.fix.outputs.patch }}" != true ]; then
            mkdir -p "$RUNNER_TEMP/ci-report"
            echo "<!-- wave-ci:Autofix -->" > "$RUNNER_TEMP/ci-report/autofix.md"
          fi

      - name: Keep the report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-autofix
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: ignore
          retention-days: 1

  # Commits the Autofix job's patch to the PR branch, without running any of the PR's code: its
  # scripts and formatter come from the base branch, and the PR's checkout is only read and
  # committed to (scripts/ci/apply-autofix.sh). A patch it refuses fails nothing here; Checks
  # then fails on the PR's lockfile or formatting.
  autofix-apply:
    name: Apply autofix
    needs: [autofix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    env:
      PATCHED: ${{ needs.autofix.outputs.patch == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PATCHED == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PATCHED == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: env.PATCHED == 'true'

      # No dependency cache: the PR's own jobs can write one.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.PATCHED == 'true'
        with:
          node-version: 22
          package-manager-cache: false

      # The base's formatter: the root's tools alone, with no install scripts.
      - name: Install the base's formatter
        if: env.PATCHED == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts --filter wave

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.PATCHED == 'true'
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix

      # A failure here, such as the branch having moved on, leaves Checks to check the PR as it is.
      - name: Apply the lockfile and formatting
        id: apply
        if: env.PATCHED == 'true'
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # A base from before the split has no apply script.
          if [ ! -f scripts/ci/apply-autofix.sh ]; then
            echo "::warning::The base branch can't apply the autofix yet."
            exit 0
          fi
          scripts/ci/apply-autofix.sh "$RUNNER_TEMP/autofix/autofix.patch" pr

      - name: Report a failed apply
        if: steps.apply.outcome == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-report"
          {
            echo "<!-- wave-ci:Autofix -->"
            echo "### ❌ Autofix failed"
            echo
            echo "The lockfile and formatting fix couldn't be committed. The Apply autofix job in the [run]($RUN_URL) says why."
          } > "$RUNNER_TEMP/ci-report/autofix.md"

      - name: Keep the report
        if: always() && env.PATCHED == 'true' && job.status != 'cancelled'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-autofix-apply
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: ignore
          retention-days: 1

  # The release source (docs/release-provenance.md): the one commit the rest of the run scans,
  # checks and builds, and that a release signs and publishes. The autofix commit on a PR, the
  # version bump on main (which may sit on a newer tip than the pushed commit), a promotion's ti
  # release (promoted_from, which may be older or newer than the tag's commit when the apps come
  # from different releases), or else the event's commit. It runs no code from the repo, and its
  # token only reads the ti release's commit.
  source:
    name: Release source
    needs: [version, autofix-apply]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Pick the release source
        id: pick
        env:
          SOURCE_SHA: ${{ needs.autofix-apply.outputs.sha || needs.version.outputs.sha || github.event.pull_request.head.sha || github.sha }}
          PROMOTED_FROM: ${{ inputs.promoted_from }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check release tag and each app's gate check this ti release against the tag.
          if [ -n "$PROMOTED_FROM" ]; then
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [[ "$GITHUB_REF" != refs/tags/v* ]] || [[ "$GITHUB_REF" == *-ti ]]; then
              echo "::error::Only a promotion's run on a stable tag builds from another ti release."
              exit 1
            fi
            if ! [[ "$PROMOTED_FROM" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ti$ ]]; then
              echo "::error::\"$PROMOTED_FROM\" isn't a -ti release."
              exit 1
            fi
            SOURCE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$PROMOTED_FROM" --jq .sha)"
          fi
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::No release source: \"$SOURCE_SHA\"."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" | tee -a "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: [version, source]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      # The release source, which the rest of the run checks out.
      sha: ${{ needs.source.outputs.sha }}
      source: ${{ steps.checked.outputs.source }}
      # The versioned release this run publishes, or empty: the version bump's on main
      # (scripts/ci/next-version.ts), or a promoted or hand-pushed tag, which "Check release tag"
      # checked.
      release_tag: ${{ needs.version.outputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      # The release gate's evidence: the commit this job actually checked out.
      - name: Record the checked-out source
        id: checked
        run: echo "source=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # The pnpm store is the workflows' own cache (.github/actions/pnpm-store).
          package-manager-cache: false

      - uses: ./.github/actions/pnpm-store

      - name: Install
        run: scripts/ci/step.sh "Install" pnpm install --frozen-lockfile

      # Checks keeps Linux's store: its install is the whole workspace's.
      - uses: ./.github/actions/pnpm-store
        with:
          save: true

      # Fails a tag that isn't v<app version> before the APK job starts. A promotion's tag may
      # name a newer version than the ti release it builds (promoted_from).
      - name: Check release tag
        if: env.IS_RELEASE == 'true'
        env:
          PROMOTED_FROM: ${{ inputs.promoted_from }}
        run: scripts/ci/step.sh "Check release tag" scripts/ci/check-release-tag.sh "$GITHUB_REF_NAME"

      # On PRs, by the rule in scripts/ci/changes.ts: the packages the PR changed and their
      # dependents, or all of them. Pushes to main and release tags always check every package.
      - name: Pick the packages to check
        id: packages
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: scripts/ci/affected-packages.sh

      - name: Typecheck
        env:
          PACKAGES_FILTER: ${{ steps.packages.outputs.filter }}
        run: scripts/ci/step.sh "Typecheck" scripts/ci/packages.sh typecheck

      - name: Lint
        run: scripts/ci/step.sh "Lint" pnpm lint

      - name: Format check
        run: scripts/ci/step.sh "Format check" pnpm fmt:check

      - name: Action pins
        run: scripts/ci/step.sh "Action pins" node scripts/ci/action-pins.ts

      - name: Untrusted code
        run: scripts/ci/step.sh "Untrusted code" node scripts/ci/untrusted-code.ts

      - name: Test
        env:
          PACKAGES_FILTER: ${{ steps.packages.outputs.filter }}
        run: scripts/ci/step.sh "Test" scripts/ci/packages.sh test

      - name: Report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.source.outputs.sha }}
        run: scripts/ci/report.sh "${{ job.status }}" "Checks"

      - name: Keep the report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-checks
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: ignore
          retention-days: 1

  # The phone's jobs (mobile.yml): Native unit tests, Android APK, the phone's release gate and
  # its release. A PR calls it when its native tests apply; main and tags call it when the phone
  # changed since its own previous release (changes.phoneRelease, scripts/ci/changes.ts). It runs
  # when a shared job failed too, so its gate can say what refused the release. Nothing of the
  # desktop's reaches it. Its jobs show as "Mobile / <job>".
  mobile:
    name: Mobile
    needs: [source, changes, secret-scan, checks, notes]
    if: >-
      ${{ !cancelled() && needs.source.result == 'success' &&
      ((github.event_name == 'pull_request' && needs.changes.outputs.nativeTests == 'true') ||
      (github.event_name != 'pull_request' && needs.changes.outputs.phoneRelease == 'true')) }}
    # The most its jobs may ask for: its release job publishes, the others only read.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/mobile.yml
    # The release secrets live only in the release Environments, which only its release job
    # opens (docs/spec.md, Release secrets).
    secrets: inherit
    with:
      source_sha: ${{ needs.source.outputs.sha }}
      release_tag: ${{ needs.checks.outputs.release_tag }}
      # The ti release a promotion builds the phone from; empty takes the tag's own number.
      promoted_from: ${{ inputs.promoted_from }}
      # The shared jobs' results and outputs, which the phone's gate admits on.
      evidence: ${{ toJSON(needs) }}
      notes: ${{ needs.notes.outputs.notes }}
      localized_notes: ${{ needs.notes.outputs.localized }}
      earlier_notes: ${{ needs.notes.outputs.earlier }}

  # The desktop's jobs (desktop.yml): Desktop (Linux) and Desktop (Windows), the desktop's release
  # gate, Sign the Windows release and the desktop's release. A PR calls it when the desktop's
  # checks apply; main and tags call it when the desktop changed since its own previous release
  # (changes.desktopRelease). Nothing of the phone's reaches it. Its jobs show as
  # "Desktop / <job>".
  desktop:
    name: Desktop
    needs: [source, changes, secret-scan, checks, notes]
    if: >-
      ${{ !cancelled() && needs.source.result == 'success' &&
      ((github.event_name == 'pull_request' && needs.changes.outputs.desktopChecks == 'true') ||
      (github.event_name != 'pull_request' && needs.changes.outputs.desktopRelease == 'true')) }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/desktop.yml
    # The release secrets live only in the release Environments, which only Sign the Windows
    # release and its release job open (docs/spec.md, Release secrets).
    secrets: inherit
    with:
      source_sha: ${{ needs.source.outputs.sha }}
      release_tag: ${{ needs.checks.outputs.release_tag }}
      # The ti release a promotion builds the desktop from; empty takes the tag's own number.
      promoted_from: ${{ inputs.promoted_from }}
      # The shared jobs' results and outputs, which the desktop's gate admits on.
      evidence: ${{ toJSON(needs) }}
      # The desktop's own notes, so a version it publishes alone doesn't go out with the phone's.
      notes: ${{ needs.notes.outputs.desktop }}
      desktop_notes: ${{ needs.notes.outputs.desktop_localized }}

  # Posts the comments the jobs above left in their ci-report-* artifacts. Those jobs run the
  # PR's code with read-only tokens; this one runs none of it, using the base branch's scripts.
  report:
    name: Report
    needs: [changes, secret-scan, autofix, autofix-apply, checks, mobile, desktop]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: ci-report-*
          merge-multiple: true
          path: ${{ runner.temp }}/ci-report

      - name: Post the comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A base from before the split has no poster.
          if [ ! -f scripts/ci/post-reports.sh ]; then
            echo "::warning::The base branch can't post these comments yet."
            exit 0
          fi
          scripts/ci/post-reports.sh "$RUNNER_TEMP/ci-report"
