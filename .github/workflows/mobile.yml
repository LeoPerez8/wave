name: Mobile

# The phone's half of CI, called by ci.yml once its shared jobs have run: the native unit tests,
# the Android APK, the phone's release gate and the release job (docs/spec.md, Build and CI).
# A desktop failure never reaches it, and nothing here waits for the desktop.
on:
  workflow_call:
    inputs:
      # The release source (docs/release-provenance.md): the one commit every job here checks out.
      source_sha:
        type: string
        required: true
      # v<version> when the run publishes a versioned release, else empty.
      release_tag:
        type: string
        required: false
        default: ""
      # The -ti release a promotion builds the phone from (promote.sh), at or below release_tag.
      # Empty takes the stable tag's own number.
      promoted_from:
        type: string
        required: false
        default: ""
      # The shared jobs' evidence, as the caller's toJSON(needs): source, changes, secret-scan,
      # checks and notes. The release gate admits on it together with this workflow's own jobs.
      evidence:
        type: string
        required: true
      # The Patch notes job's outputs the release publishes.
      notes:
        type: string
        required: false
        default: ""
      localized_notes:
        type: string
        required: false
        default: ""
      earlier_notes:
        type: string
        required: false
        default: ""

# Each job asks for what it needs, within what the caller's job grants.
permissions: {}

env:
  IS_SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
  IS_RELEASE: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') }}
  IS_TI: ${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-ti')) }}

jobs:
  # JVM tests for the local native modules (tag reading, folder walking, artwork, the
  # screen under Now Playing), in a job of their own so they run beside the APK build
  # instead of before it.
  native-tests:
    name: Native unit tests
    # Only PRs can skip: on main and release tags every area counts as changed, and the release
    # gate refuses a release whose native tests didn't run and pass. They wait for Checks to pass.
    if: >-
      ${{ fromJSON(inputs.evidence).changes.outputs.nativeTests == 'true' &&
      fromJSON(inputs.evidence).checks.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source: ${{ steps.checked.outputs.source }}
    env:
      HEAD_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      # The release gate's evidence: the commit this job actually checked out.
      - name: Record the checked-out source
        id: checked
        run: echo "source=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - uses: ./.github/actions/pnpm-store

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-disabled: true

      # Gradle's caches, keyed by what decides the build's dependencies: the lockfile, the app
      # config and plugins prebuild reads, and the Gradle files in the repo (docs/spec.md, Build
      # and CI › Caches). Main saves a new key's entry after the build; PRs only read it.
      - name: Restore Gradle's caches
        id: gradle_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mobile-gradle-tests-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts', 'apps/mobile/plugins/**', 'apps/mobile/modules/*/android/**/*.gradle*', 'packages/kotlin-shared/**/*.gradle*', 'packages/kotlin-shared/**/gradle*.properties', 'scripts/ci/prebuilt-bundle.gradle') }}
          restore-keys: mobile-gradle-tests-

      # The Kotlin the phone shares with the desktop builds and tests on its own, with no Android
      # dependency (#1144), and so does the desktop's JVM entry point in it.
      - name: Shared Kotlin
        working-directory: packages/kotlin-shared
        run: ../../scripts/ci/step.sh "Shared Kotlin" ./gradlew build --no-daemon --console=plain

      - name: Install
        run: scripts/ci/step.sh "Install" pnpm install --frozen-lockfile

      # The module builds inside the generated Android project.
      - name: Prebuild native project
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: ../../scripts/ci/step.sh "Prebuild" pnpm exec expo prebuild --platform android --no-install

      # AGP 9 only creates unit-test tasks for the tested build type (debug) in libraries.
      - name: Native unit tests
        working-directory: apps/mobile/android
        run: ../../../scripts/ci/step.sh "Native unit tests" ./gradlew :wave-native:testDebugUnitTest :wave-glass:testDebugUnitTest --no-daemon --console=plain

      # PRs build no APK, so this is where their native code compiles: the app's Kotlin and Java
      # and every native module's. The debug variant needs no JS bundle and no signing key.
      - name: Compile the app's native code
        if: github.event_name == 'pull_request'
        working-directory: apps/mobile/android
        run: ../../../scripts/ci/step.sh "Compile the app's native code" ./gradlew :app:compileDebugJavaWithJavac --no-daemon --console=plain

      - name: Save Gradle's caches
        if: github.ref == 'refs/heads/main' && steps.gradle_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle_cache.outputs.cache-primary-key }}

      - name: Report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/report.sh "${{ job.status }}" "Native unit tests"

      - name: Keep the report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report-native-tests
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: ignore
          retention-days: 1

  android:
    name: Android APK
    outputs:
      # The APK without a signature, which only the release job signs, and the name it signs it as.
      artifact: ${{ steps.apk.outputs.artifact }}
      apk: ${{ steps.apk.outputs.name }}
      update_channel: ${{ steps.updates.outputs.WAVE_UPDATE_CHANNEL }}
      runtime_version: ${{ steps.updates.outputs.WAVE_RUNTIME_VERSION }}
      # Provenance for the release gate (docs/release-provenance.md): the commit built, full or
      # repack, the unsigned APK's and the bundle's SHA-256, a repack's kept base and the update's.
      source: ${{ steps.checked.outputs.source }}
      build: ${{ steps.apk.outputs.build }}
      apk_sha256: ${{ steps.apk.outputs.apk_sha256 }}
      bundle_sha256: ${{ steps.apk.outputs.bundle_sha256 }}
      base: ${{ steps.apk.outputs.base }}
      update_sha256: ${{ steps.update_digest.outputs.sha256 }}
    # Only release runs (pushes to main and tags) build an APK: a PR run gets no secret, and its
    # native code compiles in the Native unit tests job. This job holds no signing key either: it
    # hands an unsigned APK to the release job, which signs it in its channel's Environment.
    # Only a release needs the patch notes, so elsewhere a failed notes job doesn't stop the
    # APK. A job-level `if` can't read `env`, so the release test is the tag half of IS_RELEASE.
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
      fromJSON(inputs.evidence).checks.result == 'success' &&
      (fromJSON(inputs.evidence).notes.result == 'success' ||
      !startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads main's kept APKs from other runs.
      actions: read
    env:
      # Genius's token and Ticketmaster's key are the sync Worker's alone: the APK asks both
      # through its routes (docs/spec.md, "Genius About" and "Followed artists").
      HEAD_SHA: ${{ inputs.source_sha }}
      # ccache (scripts/ci/ccache.sh) keeps its cache in ~/.cache/ccache.
      # Paths under the checkout are hashed relative to it, and the working directory
      # isn't hashed, so a different checkout path still hits.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      # The NDK is installed fresh on every run, so its compilers' mtimes change.
      CCACHE_COMPILERCHECK: content
      CCACHE_INODECACHE: "true"
      # Some libraries build with precompiled headers, which ccache only caches with these.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CCACHE_MAXSIZE: 1G
      # A full build's APK, without its signature, kept for repacks (scripts/ci/repack.ts).
      KEPT_APK: ${{ github.workspace }}/.cache/kept-apk
      WAVE_CI_BUNDLE_MANIFEST: ${{ github.workspace }}/../wave-ci-bundle.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      # The release gate's evidence: the commit this job actually checked out.
      - name: Record the checked-out source
        id: checked
        run: echo "source=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - uses: ./.github/actions/pnpm-store

      - name: Install
        run: scripts/ci/step.sh "Install" pnpm install --frozen-lockfile

      # A promotion's commit says x.y.z-ti in package.json, and its APK and bundle are x.y.z.
      # Before prebuild and the bundle, which read it. Nothing commits this.
      - name: Take the promoted version
        if: env.IS_RELEASE == 'true' && env.IS_TI != 'true'
        run: |
          sed -i -E 's/^(\s*"version":\s*)"[^"]*"/\1"'"${GITHUB_REF_NAME#v}"'"/' apps/mobile/package.json
          grep -F "\"version\": \"${GITHUB_REF_NAME#v}\"" apps/mobile/package.json

      - name: Prebuild native project
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: ../../scripts/ci/step.sh "Prebuild" pnpm exec expo prebuild --platform android --no-install

      # Main saves Metro's cache; tags only read it. Its input is the JS, so each push's entry
      # replaces the one before (scripts/ci/cache-budget.ts), and the key starts over when
      # dependencies change. The path is uniwind's cache store (os.tmpdir()), which replaces
      # Expo's in metro.config.js.
      - name: Restore Metro's cache
        id: metro_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/metro-cache
          key: mobile-metro-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: mobile-metro-${{ hashFiles('pnpm-lock.yaml') }}-

      # The label the app log names this build by, next to its version: `PR #<n> @ <commit>`,
      # or the branch or tag and the commit (scripts/ci/build-label.ts). Metro inlines it into
      # the bundle, so a repack carries this run's label, not the kept APK's.
      - name: Label the build
        run: |
          label="$(node scripts/ci/build-label.ts)"
          echo "$label" | tee -a "$GITHUB_ENV"

      # Expo + Hermes run once in either mode, before the key: Metro's assets are part of it.
      # The Gradle init script verifies its handoff below.
      - name: Bundle JavaScript
        run: scripts/ci/step.sh "Bundle JavaScript" scripts/ci/bundle.sh

      # Each full build keeps its APK under a key for its native side and Metro's assets
      # (scripts/ci/repack.ts). A push to main or a -ti tag whose key finds one swaps its JS
      # bundle into it instead of running Gradle.
      - name: Key the native side
        id: key
        run: node scripts/ci/repack.ts key apps/mobile apps/mobile/android/app/build/generated/res/react/release | tee -a "$GITHUB_OUTPUT"

      # The key is the runtime version: one rule for "same native side". The channel follows
      # the run (scripts/ci/update-config.ts).
      - name: Pick the update channel
        id: updates
        env:
          RUNTIME_VERSION: ${{ steps.key.outputs.key }}
        run: |
          { node scripts/ci/update-config.ts channel; echo "WAVE_RUNTIME_VERSION=$RUNTIME_VERSION"; } | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"

      # After the key, which must not depend on the channel. A repack stamps inside repack.sh.
      - name: Stamp the update channel and runtime version
        run: node scripts/ci/update-config.ts stamp-source apps/mobile/android/app/src/main/AndroidManifest.xml

      # What the release job publishes over the air. Never holds up the release. It needs no
      # secret: only the release job, in its channel's Environment, can publish it.
      - name: Export the over-the-air update
        id: export_update
        if: inputs.release_tag != '' && env.WAVE_UPDATE_CHANNEL != ''
        continue-on-error: true
        run: scripts/ci/step.sh "Export the over-the-air update" scripts/ci/export-update.sh "$RUNNER_TEMP/update"

      # What the release job checks the update against before publishing it.
      - name: Digest the over-the-air update
        id: update_digest
        if: steps.export_update.outcome == 'success'
        continue-on-error: true
        run: echo "sha256=$(node scripts/ci/release-gate.ts digest "$RUNNER_TEMP/update")" | tee -a "$GITHUB_OUTPUT"

      - name: Keep the over-the-air update
        if: steps.export_update.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/update
          retention-days: 1

      - name: Restore the kept APK
        id: kept
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.KEPT_APK }}
          key: ${{ steps.key.outputs.key }}
          lookup-only: ${{ env.IS_TI != 'true' }}

      # When the cache has no entry, restore an exact-key full build from a successful
      # push on main, validated by kept-apk.ts before downloading it.
      - name: Find a kept APK artifact
        id: kept_artifact
        if: env.IS_TI == 'true' && steps.kept.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_KEY: ${{ steps.key.outputs.key }}
        run: node scripts/ci/kept-apk.ts "$NATIVE_KEY" | tee -a "$GITHUB_OUTPUT"

      - name: Restore the kept APK artifact
        id: kept_download
        if: steps.kept_artifact.outputs.runId != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.kept_artifact.outputs.runId }}
          name: kept-${{ steps.key.outputs.key }}
          path: ${{ env.KEPT_APK }}

      # A kept APK repacks only with the record of the full build that kept it: the commit and
      # run that built it, for the release's provenance, and its digest (scripts/ci/kept-build.ts).
      - name: Check the kept build's record
        id: kept_base
        if: steps.kept.outputs.cache-hit == 'true' || steps.kept_download.outcome == 'success'
        env:
          NATIVE_KEY: ${{ steps.key.outputs.key }}
        run: node scripts/ci/kept-build.ts check "$KEPT_APK" "$NATIVE_KEY" | tee -a "$GITHUB_OUTPUT"

      # Stable tags stay full builds. Pushes to main and -ti tags may repack.
      - name: Plan the APK build
        env:
          KEPT: ${{ steps.kept_base.outputs.base != '' }}
        run: node scripts/ci/repack.ts plan | tee -a "$GITHUB_ENV"

      - name: Repack the kept APK
        if: env.APK_BUILD == 'repack'
        run: |
          scripts/ci/step.sh "Repack the kept APK" scripts/ci/repack.sh "$KEPT_APK" "$RUNNER_TEMP/repacked.apk"
          echo "BUILT_APK=$RUNNER_TEMP/repacked.apk" >> "$GITHUB_ENV"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: env.APK_BUILD == 'full'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        if: env.APK_BUILD == 'full'
        with:
          cache-disabled: true

      # Gradle's caches for the release build, keyed as the native tests' are. Main saves a new
      # key's entry after the build; tags only read it.
      - name: Restore Gradle's caches
        id: gradle_cache
        if: env.APK_BUILD == 'full'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mobile-gradle-android-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts', 'apps/mobile/plugins/**', 'apps/mobile/modules/*/android/**/*.gradle*', 'packages/kotlin-shared/**/*.gradle*', 'packages/kotlin-shared/**/gradle*.properties', 'scripts/ci/prebuilt-bundle.gradle') }}
          restore-keys: mobile-gradle-android-

      # Main saves its compiled objects; tags only restore them. The repo has no C or C++ of its
      # own, so what ccache compiles comes from the lockfile: one entry per lockfile, seeded from
      # an older one when dependencies change. CCACHE_MAXSIZE bounds what it carries over.
      - name: Restore ccache
        id: ccache
        if: env.APK_BUILD == 'full'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: mobile-ccache-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: mobile-ccache-

      - name: Set up ccache
        if: env.APK_BUILD == 'full'
        run: scripts/ci/ccache.sh setup

      - name: Save Metro's cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/metro-cache
          key: ${{ steps.metro_cache.outputs.cache-primary-key }}

      - name: Build release APK
        if: env.APK_BUILD == 'full'
        working-directory: apps/mobile/android
        run: ../../../scripts/ci/step.sh "Gradle assembleRelease" ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --init-script ../../../scripts/ci/prebuilt-bundle.gradle --no-daemon --console=plain --profile --stacktrace

      # Gradle signs with prebuild's public debug keystore. What leaves this job has no signature,
      # and only the release job signs it, with the release key.
      - name: Drop the build's signature
        if: env.APK_BUILD == 'full'
        run: |
          scripts/ci/unsigned-apk.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/unsigned.apk"
          echo "BUILT_APK=$RUNNER_TEMP/unsigned.apk" >> "$GITHUB_ENV"

      # Room creates WorkManager's database reflectively before JS starts. Check the
      # minified artifact on full builds and repacks; a debug/unit test misses this.
      - name: Check WorkManager's startup constructor
        run: |
          built="${BUILT_APK:?}"
          dexdump="$(find "$ANDROID_HOME/build-tools" -name dexdump -type f | sort -V | tail -n 1)"
          test -n "$dexdump"
          "$dexdump" -l xml "$built" | node scripts/ci/work-database.ts

      # The APK must ship an ART profile, and once apps/mobile/profiles/ has Wave's own, nearly
      # all of it (#317). A repack keeps the kept build's dex and profile, so only full builds check.
      - name: Check the APK's ART profile
        if: env.APK_BUILD == 'full'
        run: scripts/ci/step.sh "ART profile check" node scripts/perf/perf.ts profile check-apk apps/mobile/android/app/build/outputs/apk/release/app-release.apk --mapping apps/mobile/android/app/build/outputs/mapping/release/mapping.txt

      - name: CMake task times
        if: always() && env.APK_BUILD == 'full'
        run: scripts/ci/cmake-times.sh apps/mobile/android

      - name: ccache statistics
        if: always() && env.APK_BUILD == 'full'
        run: scripts/ci/ccache.sh stats

      - name: Save ccache
        if: github.ref == 'refs/heads/main' && env.APK_BUILD == 'full' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Save Gradle's caches
        if: github.ref == 'refs/heads/main' && env.APK_BUILD == 'full' && steps.gradle_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle_cache.outputs.cache-primary-key }}

      # A full build keeps its APK for later runs with the same native side to repack: unsigned,
      # with its record and no key beside it. Like every cache write, the entry is main's: a tag
      # reads main's entries, and one saved in a tag's scope no other run reads.
      - name: Keep the full build for repacks
        if: env.APK_BUILD == 'full' && steps.kept.outputs.cache-hit != 'true'
        env:
          NATIVE_KEY: ${{ steps.key.outputs.key }}
        run: |
          rm -rf "$KEPT_APK" && mkdir -p "$KEPT_APK"
          cp "$BUILT_APK" "$KEPT_APK/app-release.apk"
          node scripts/ci/kept-build.ts keep "$KEPT_APK" "$NATIVE_KEY" "$HEAD_SHA" "$GITHUB_RUN_ID"
          test "$(ls -A "$KEPT_APK" | sort | tr '\n' ' ')" = "app-release.apk kept-build.json "

      - name: Save the kept APK
        if: github.ref == 'refs/heads/main' && env.APK_BUILD == 'full' && steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.KEPT_APK }}
          key: ${{ steps.key.outputs.key }}

      - name: Keep main's full APK for when the cache misses
        if: github.ref == 'refs/heads/main' && env.APK_BUILD == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kept-${{ steps.key.outputs.key }}
          path: ${{ env.KEPT_APK }}
          include-hidden-files: true
          retention-days: 30

      - name: Collect APK
        id: apk
        env:
          KEPT_BASE: ${{ steps.kept_base.outputs.base }}
        run: |
          name="wave-${HEAD_SHA:0:7}.apk"
          built="${BUILT_APK:?}"
          bundle="apps/mobile/android/app/build/generated/assets/react/release/index.android.bundle"
          unzip -p "$built" assets/index.android.bundle | cmp - "$bundle"
          echo "Packaged this run's bundle: $(sha256sum "$bundle")"
          # Hermes keeps the inlined label as a plain string.
          grep -qaF -- "${EXPO_PUBLIC_WAVE_BUILD_LABEL:?}" "$bundle"
          echo "Labelled: $EXPO_PUBLIC_WAVE_BUILD_LABEL"
          cp "$built" "$RUNNER_TEMP/unsigned-$name"
          {
            echo "path=$RUNNER_TEMP/unsigned-$name"
            echo "artifact=unsigned-$name"
            echo "name=$name"
            echo "build=${APK_BUILD:?}"
            echo "apk_sha256=$(node scripts/ci/release-gate.ts digest "$RUNNER_TEMP/unsigned-$name")"
            echo "bundle_sha256=$(node scripts/ci/release-gate.ts digest "$bundle")"
            # A repack's native base: the kept full build's record.
            if [ "$APK_BUILD" = repack ]; then echo "base=${KEPT_BASE:?}"; fi
          } | tee -a "$GITHUB_OUTPUT"

      # The APK's and the Hermes bundle's size against their budget (scripts/ci/size-budget.json),
      # for the sticky comment and every run's summary, releases' included. Over budget warns;
      # it never fails the build.
      - name: Measure the APK and the bundle
        continue-on-error: true
        run: |
          node scripts/ci/app-size.ts "${{ steps.apk.outputs.path }}" \
            apps/mobile/android/app/build/generated/assets/react/release/index.android.bundle \
            "$RUNNER_TEMP/app-size.md"
          cat "$RUNNER_TEMP/app-size.md" >> "$GITHUB_STEP_SUMMARY"

      # For the release job to sign. No phone installs it as it is.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 1

      - name: Keep the report
        if: always() && env.IS_SAME_REPO_PR == 'true' && job.status != 'cancelled'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report-android
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: ignore
          retention-days: 1

  # The phone's release gate (docs/release-provenance.md, scripts/ci/release-gate.ts). The release
  # job, and with it the signing key and the publishing secrets, opens only when Secret scan,
  # Checks, the native tests, the patch notes and the APK all succeeded on the run's release
  # source. The shared jobs' evidence comes from ci.yml (inputs.evidence), this workflow's own from
  # its needs. The desktop's jobs are in neither, so they can't refuse the phone's release.
  # It runs when one of them failed too, to say what refused the release; a cancelled run stops
  # here. Its provenance record is what the release job checks the APK and the update against.
  # It holds no secret and opens no Environment, so a healthy ti release still needs no approval.
  release-gate:
    name: Release gate
    needs: [native-tests, android]
    if: >-
      ${{ !cancelled() && (inputs.release_tag != '' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.admit.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          sparse-checkout: |
            scripts/ci
            apps/updates
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # A stable tag promotes the phone's newest ti release at or below it (promoted_from, by
      # default the same number's), and is admitted only with that release's sealed record for
      # the same source (#1130). Without one, admit refuses.
      - name: Fetch the promoted ti release's record
        if: startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref, '-ti')
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTED_FROM: ${{ inputs.promoted_from }}
        run: |
          promoted="${PROMOTED_FROM:-${GITHUB_REF_NAME}-ti}"
          echo "PROMOTED_TAG=$promoted" >> "$GITHUB_ENV"
          gh release download "$promoted" --repo "$GITHUB_REPOSITORY" \
            --pattern "wave-${promoted#v}.provenance.json" --dir "$RUNNER_TEMP/promoted" ||
            echo "::warning::$promoted has no provenance record to download."

      - name: Admit the release
        id: admit
        env:
          SHARED: ${{ inputs.evidence }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # The shared jobs and this workflow's own, as one set of prerequisites.
          node -e 'const [shared, own] = process.argv.slice(1).map((json) => JSON.parse(json)); console.log(JSON.stringify({ ...shared, ...own }))' \
            "$SHARED" "$NEEDS" > "$RUNNER_TEMP/needs.json"
          promoted="${PROMOTED_TAG:-${GITHUB_REF_NAME}-ti}"
          node scripts/ci/release-gate.ts admit "$RUNNER_TEMP/needs.json" "$RUNNER_TEMP/promoted/wave-${promoted#v}.provenance.json" "$promoted" > "$RUNNER_TEMP/provenance.json"
          cat "$RUNNER_TEMP/provenance.json"
          node -e 'console.log(`sha=${JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).source}`)' \
            "$RUNNER_TEMP/provenance.json" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-provenance
          path: ${{ runner.temp }}/provenance.json
          retention-days: 14

  # Signs the APK and publishes the release the Checks job decided on: a hand-pushed tag, or a
  # branch push's version bump, whose v<version> tag the Version job pushed with it. A tag pushed
  # with the workflow's token doesn't start another run. A push to main that releases nothing
  # still signs its APK here, for the rolling ti-latest build. Only what the release gate
  # admitted gets here: test releases can repack without Gradle, but neither channel publishes
  # before the native tests pass, and the stable path keeps its full APK build policy.
  # The desktop publishes its installers to the same GitHub Release on its own (desktop.yml);
  # whichever app gets there first creates it (scripts/ci/publish-release.sh).
  release:
    name: Publish versioned release
    needs: [release-gate, android]
    if: >-
      ${{ !cancelled() && needs.release-gate.result == 'success' &&
      (inputs.release_tag != '' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    # The release secrets, the APK's release key among them, live only in the release
    # Environments (docs/spec.md, Release secrets), which give this job their
    # secrets: ti opens to pushes to main with no approval; every tag run, a promotion's or a
    # hand-pushed -ti tag's, takes main and waits for the owner. The channel stays the run's.
    environment: ${{ github.ref == 'refs/heads/main' && 'ti' || 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPDATES_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.UPDATES_SIGNING_KEY != '' }}
    steps:
      - name: Check the patch notes
        if: inputs.release_tag != ''
        env:
          NOTES_OUTCOME: ${{ fromJSON(inputs.evidence).notes.outputs.outcome }}
        run: |
          if [ "$NOTES_OUTCOME" != "success" ]; then
            echo "::error::The Patch notes job failed, so nothing is published. Re-run the failed jobs."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.release-gate.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            apps/updates

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # The gate's provenance record (docs/release-provenance.md).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-provenance
          path: ${{ runner.temp }}/provenance

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.android.outputs.artifact }}
          path: ${{ runner.temp }}/unsigned

      # Nothing is signed but the unsigned APK the gate admitted for the release source.
      - name: Check the APK against the gate's record
        env:
          UNSIGNED: ${{ needs.android.outputs.artifact }}
        run: node scripts/ci/release-gate.ts verify "$RUNNER_TEMP/provenance/provenance.json" "$RUNNER_TEMP/unsigned/$UNSIGNED"

      # Every APK a phone installs carries the release key and its rotation proof from the old
      # key, full builds and repacks alike, on both channels (docs/spec.md, APK signing).
      - name: Sign the APK
        env:
          WAVE_RELEASE_KEYSTORE: ${{ secrets.WAVE_RELEASE_KEYSTORE }}
          WAVE_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.WAVE_RELEASE_KEYSTORE_PASSWORD }}
          WAVE_SIGNING_LINEAGE: ${{ secrets.WAVE_SIGNING_LINEAGE }}
          UNSIGNED: ${{ needs.android.outputs.artifact }}
          APK_NAME: ${{ needs.android.outputs.apk }}
        run: scripts/ci/sign-apk.sh "$RUNNER_TEMP/unsigned/$UNSIGNED" "$RUNNER_TEMP/release/$APK_NAME"

      # The record, with the signed APK's digest, goes with the release and stays with the run.
      - name: Seal the provenance record
        env:
          APK_NAME: ${{ needs.android.outputs.apk }}
        run: |
          node scripts/ci/release-gate.ts seal "$RUNNER_TEMP/provenance/provenance.json"             "$RUNNER_TEMP/release/$APK_NAME" > "$RUNNER_TEMP/provenance/sealed.json"
          cat "$RUNNER_TEMP/provenance/sealed.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-provenance-sealed
          path: ${{ runner.temp }}/provenance/sealed.json
          retention-days: 14

      # Where this release's source is (docs/release-source.md). Off until the owner sets the
      # repository variable RELEASE_SOURCE_DELIVERY to `on`. Once on, a manifest that doesn't
      # check out against the tag stops the release before anything is published.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: vars.RELEASE_SOURCE_DELIVERY == 'on' && inputs.release_tag != ''
        with:
          ref: ${{ needs.release-gate.outputs.sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the release source
        if: vars.RELEASE_SOURCE_DELIVERY == 'on' && inputs.release_tag != ''
        working-directory: release-source
        run: |
          out="$RUNNER_TEMP/source"
          mkdir -p "$out"
          node scripts/ci/release-source.ts manifest "$RUNNER_TEMP/provenance/sealed.json" > "$out/manifest.json"
          node scripts/ci/release-source.ts verify "$out/manifest.json"
          node scripts/ci/release-source.ts directions "$out/manifest.json" > "$out/directions.md"
          echo "SOURCE_MANIFEST_FILE=$out/manifest.json" >> "$GITHUB_ENV"
          echo "SOURCE_DIRECTIONS_FILE=$out/directions.md" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.android.outputs.apk }}
          path: ${{ runner.temp }}/release/${{ needs.android.outputs.apk }}
          retention-days: 14

      # A rolling prerelease per channel gives a stable link that installs straight from the
      # phone's browser: ti-latest moves on every push to main, latest with every promotion.
      - name: Move the ti test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # When this push releases, the release goes on without it.
        continue-on-error: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.release-gate.outputs.sha }}
          APK_NAME: ${{ needs.android.outputs.apk }}
        run: |
          tag="ti-latest"; asset="wave-ti.apk"
          cp "$RUNNER_TEMP/release/$APK_NAME" "$RUNNER_TEMP/$asset"
          gh release view "$tag" > /dev/null 2>&1 || \
            gh release create "$tag" --prerelease --latest=false --target "$HEAD_SHA" --title "Latest ti test build" \
              --notes "Sideloadable APK, rebuilt on every push. Not for distribution."
          gh release upload "$tag" "$RUNNER_TEMP/$asset" --clobber

      - name: Publish the release
        id: published
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ needs.release-gate.outputs.sha }}
          PATCH_NOTES: ${{ inputs.notes }}
          APK_NAME: ${{ needs.android.outputs.apk }}
          PROVENANCE_FILE: ${{ runner.temp }}/provenance/sealed.json
        run: |
          if [ -n "$PATCH_NOTES" ]; then
            export RELEASE_NOTES_FILE="$RUNNER_TEMP/patch-notes.md"
            printf '%s\n' "$PATCH_NOTES" > "$RELEASE_NOTES_FILE"
          fi
          scripts/ci/publish-release.sh "$RUNNER_TEMP/release/$APK_NAME"

      # The rolling link to what's on the main channel.
      - name: Move the latest build
        if: steps.published.outputs.url != '' && !endsWith(inputs.release_tag, '-ti')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ needs.android.outputs.apk }}
        run: |
          cp "$RUNNER_TEMP/release/$APK_NAME" "$RUNNER_TEMP/wave-latest.apk"
          gh release upload latest "$RUNNER_TEMP/wave-latest.apk" --clobber

      # After the release, so phones never get a version that has none: publish-release.sh answers
      # no url when it published nothing (a moved tag). None of these can fail the release: without
      # the secrets the last one says so and publishes nothing.
      # The notes go before the update, so a phone that gets it finds its notes.
      - name: Publish the release notes
        if: steps.published.outputs.url != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WAVE_UPDATE_CHANNEL: ${{ needs.android.outputs.update_channel }}
          WAVE_RELEASE_TAG: ${{ inputs.release_tag }}
          WAVE_RELEASE_NOTES: ${{ inputs.localized_notes }}
          WAVE_EARLIER_NOTES: ${{ inputs.earlier_notes }}
        run: node apps/updates/scripts/publish-notes.ts

      # The APK phones on another native side install (docs/spec.md, Build and CI).
      - name: Publish the latest APK
        if: steps.published.outputs.url != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPDATES_SIGNING_KEY: ${{ secrets.UPDATES_SIGNING_KEY }}
          WAVE_UPDATE_CHANNEL: ${{ needs.android.outputs.update_channel }}
          WAVE_RUNTIME_VERSION: ${{ needs.android.outputs.runtime_version }}
          WAVE_RELEASE_TAG: ${{ inputs.release_tag }}
          WAVE_APK_URL: ${{ steps.published.outputs.url }}
          APK_NAME: ${{ needs.android.outputs.apk }}
        run: WAVE_APK_PATH="$RUNNER_TEMP/release/$APK_NAME" node apps/updates/scripts/publish-apk.ts

      - name: Fetch the over-the-air update
        if: env.UPDATES_CONFIGURED == 'true' && steps.published.outputs.url != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: update-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/update

      # Phones get only the update the gate admitted, exported from the release source.
      - name: Check the update against the gate's record
        id: update_admitted
        if: env.UPDATES_CONFIGURED == 'true' && steps.published.outputs.url != ''
        continue-on-error: true
        run: node scripts/ci/release-gate.ts verify-update "$RUNNER_TEMP/provenance/provenance.json" "$RUNNER_TEMP/update"

      - name: Publish the over-the-air update
        if: steps.published.outputs.url != '' && steps.update_admitted.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPDATES_SIGNING_KEY: ${{ secrets.UPDATES_SIGNING_KEY }}
          WAVE_UPDATE_CHANNEL: ${{ needs.android.outputs.update_channel }}
          WAVE_RUNTIME_VERSION: ${{ needs.android.outputs.runtime_version }}
        run: node apps/updates/scripts/publish.ts "$RUNNER_TEMP/update"
