[package]
name = "wave-audio-node"
version = "0.1.0"
description = "The audio engine as a Node addon, loaded in the desktop app's audio process."
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.16.2", default-features = false, features = ["napi4"] }
napi-derive = "3.7.1"
wave-audio = { path = "../engine" }

[build-dependencies]
napi-build = "2.6.0"
