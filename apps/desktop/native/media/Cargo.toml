[package]
name = "wave-media-node"
version = "0.1.0"
description = "System media controls for Wave's main process."
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.16.2", default-features = false, features = ["napi4", "dyn-symbols"] }
napi-derive = "3.7.1"
souvlaki = "0.9.3"

[build-dependencies]
napi-build = "2.6.0"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Storage_Streams"] }
