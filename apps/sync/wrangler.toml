# Wave's sync service. No secret or account-specific value lives here:
# TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, GOOGLE_CLIENT_ID, SOULSEEK_KEY (and any later
# SOULSEEK_KEY_<n>), GENIUS_ACCESS_TOKEN, TICKETMASTER_API_KEY, the optional ALLOWED_EMAILS and
# the usage watch's optional CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_ANALYTICS_TOKEN (src/usage.ts)
# are set with `wrangler secret put` (or `.dev.vars` locally).
name = "wave-sync"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# Per-address limits, counted before the database (src/limits.ts holds the same
# numbers, and a test checks they match). Counts are local and approximate: a
# best-effort brake on heavy traffic, not an exact limit. Each namespace_id must be unique in
# the Cloudflare account.
[[ratelimits]]
name = "ADDRESS_LIMITER"
namespace_id = "61001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "FAILED_LOOKUP_LIMITER"
namespace_id = "61002"
simple = { limit = 20, period = 60 }

# Requests per minute one account may send the Genius routes (keyed by the account,
# counted before the cache): `maxGeniusRequestsPerMinute` in src/limits.ts.
[[ratelimits]]
name = "GENIUS_LIMITER"
namespace_id = "61003"
simple = { limit = 30, period = 60 }

# Requests per minute one account may send the Ticketmaster routes (keyed by the account,
# counted before the cache): `maxTicketmasterRequestsPerMinute` in src/limits.ts.
[[ratelimits]]
name = "TICKETMASTER_LIMITER"
namespace_id = "61004"
simple = { limit = 300, period = 60 }

# The hourly usage watch (src/usage.ts): warns in the logs before a free plan's limit.
[triggers]
crons = ["0 * * * *"]

# Workers Logs keep the Worker's own lines (the usage warnings and the refusal counts) and no
# invocation logs, which would name each request's route and query; Issues turns logged errors
# into notifications. A deploy without these keys turns them off.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false

[observability.issues]
enabled = true
