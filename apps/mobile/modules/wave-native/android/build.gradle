plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.leoperez.wave.native'
version = '0.0.0'

android {
  namespace 'expo.modules.wavenative'
  defaultConfig {
    versionCode 1
    versionName '0.0.0'
    consumerProguardFiles 'proguard-rules.pro'
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  // Tag reading (and, in v2, writing) for MP3, FLAC, M4A, Ogg Vorbis and WAV.
  implementation 'net.jthink:jaudiotagger:3.0.1'
  implementation 'androidx.palette:palette:1.0.0'
  // The "Import to Wave" sharing shortcut (ShareShortcut): ShortcutManagerCompat.
  implementation 'androidx.core:core:1.16.0'
  // Playback: ExoPlayer in a MediaSessionService (notification, lock screen, headset buttons).
  implementation 'androidx.media3:media3-exoplayer:1.11.1'
  implementation 'androidx.media3:media3-session:1.11.1'
  // Whether Android Auto is connected, so the Auto lyric line never outlasts the drive.
  implementation 'androidx.car.app:app:1.7.0'
  // Starting the JS runtime headless for Android Auto (JsRuntime). The app provides it;
  // React Native's Gradle plugin picks the version.
  compileOnly 'com.facebook.react:react-android'
  // YT Music: innertubex (GPL-3.0, from JitPack) talks to YouTube Music; it ships no HTTP
  // engine and sends @Serializable bodies, so the client needs OkHttp and content negotiation.
  // Responses are parsed with kotlinx.serialization's JsonElement API (YtSearchParser).
  implementation 'com.github.MetrolistGroup.innertubex:innertubex:0.8.6'
  implementation 'io.ktor:ktor-client-okhttp:3.6.0'
  // ktor's OkHttp 5 replaces React Native's OkHttp 4 app-wide, but not React Native's
  // okhttp-urlconnection 4 cookie jar, which calls OkHttp 4 internals: any fetch to a host that
  // set a cookie (Deezer) then killed the app (#119). The BOM moves every OkHttp module to 5.
  // Keep it at or above the OkHttp ktor-client-okhttp asks for.
  implementation platform('com.squareup.okhttp3:okhttp-bom:5.5.0')
  implementation 'io.ktor:ktor-client-content-negotiation:3.6.0'
  implementation 'io.ktor:ktor-serialization-kotlinx-json:3.6.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'

  // Wave account: Google sign-in through Android's account picker (Credential Manager), for an
  // ID token for Wave's web client id.
  implementation 'androidx.credentials:credentials:1.6.0'
  implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
  implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'

  testImplementation 'junit:junit:4.13.2'
  // React Native's networking (its OkHttp cookie jar), resolved next to ktor's OkHttp as in the app.
  testImplementation 'com.facebook.react:react-android'
}

// Print assertion messages in CI logs, which are all the PR comment shows.
tasks.withType(Test).configureEach {
  testLogging {
    events 'failed'
    exceptionFormat 'full'
  }
}
